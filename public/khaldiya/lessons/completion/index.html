<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary:#3F7CB8; --primary-dk:#2B5F94; --accent:#4FA877;
    --bg:#f4f8fb; --surface:#ffffff; --border:#e2e8f0;
    --text:#0f172a; --muted:#64748b; --radius:16px; --radius-lg:22px;
    --shadow:0 8px 24px -8px rgba(63,124,184,.20),0 2px 6px rgba(15,23,42,.04);
    --shadow-lg:0 24px 60px -20px rgba(63,124,184,.30);
    --grad-hero:linear-gradient(135deg,#3F7CB8 0%,#4A96A0 55%,#4FA877 100%);
  }
  html,body{min-height:100vh;font-family:'Tajawal','Cairo',Arial,sans-serif;background:var(--bg);color:var(--text);direction:rtl;font-size:16px;font-weight:500;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Cairo','Tajawal',sans-serif;font-weight:800;}

  /* Modal */
  #modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.65);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;}
  #modal-box{background:#fff;border-radius:24px;padding:36px 32px;max-width:420px;width:100%;text-align:center;box-shadow:0 32px 80px rgba(15,23,42,.25);}
  #modal-box .modal-icon{font-size:48px;margin-bottom:12px;}
  #modal-box h2{font-size:22px;color:var(--text);margin-bottom:10px;}
  #modal-box p{font-size:15px;color:var(--muted);line-height:1.7;margin-bottom:24px;}
  #modal-box button{background:var(--grad-hero);color:#fff;border:none;border-radius:99px;padding:12px 32px;font-size:15px;font-family:inherit;font-weight:800;cursor:pointer;width:100%;}
  #modal-box button:hover{opacity:.9;}

  .topbar{background:var(--grad-hero);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 6px 24px -10px rgba(7,54,105,.55);min-height:64px;}
  .topbar-title{font-family:'Cairo',sans-serif;font-weight:800;font-size:17px;white-space:nowrap;}
  .topbar-back{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:99px;padding:6px 18px;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background .18s;order:1;}
  .topbar-back:hover{background:rgba(255,255,255,.28);}

  .hero-banner{background:var(--grad-hero);color:#fff;padding:36px 24px 48px;text-align:center;position:relative;overflow:hidden;}
  .hero-banner::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 120%,rgba(255,255,255,.12),transparent 70%);pointer-events:none;}
  .hero-banner h1{font-size:clamp(22px,4vw,34px);text-shadow:0 4px 16px rgba(7,54,105,.35);margin-bottom:8px;}
  .hero-banner p{font-size:15px;opacity:.88;font-weight:500;}
  .hero-pill{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:4px 18px;font-size:13px;font-weight:700;margin-bottom:12px;}

  .container{max-width:1200px;margin:0 auto;padding:32px 20px 60px;}
  .section-header{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .section-header h2{font-size:18px;color:var(--primary);}
  .count-badge{background:var(--primary);color:#fff;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:700;}

  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}

  a.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px 14px;aspect-ratio:1/1;text-decoration:none;color:var(--text);background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;position:relative;}
  a.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--primary);}
  a.card.intro{background:linear-gradient(135deg,#eaf2f9 0%,#e8f4ee 100%);border-color:var(--primary);border-style:dashed;border-width:2px;}
  a.card.soon,a.card.disabled{opacity:.45;pointer-events:none;box-shadow:none;}

  .play-wrap{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,#eaf2f9,#e8f4ee);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;}
  .card.intro .play-wrap{background:linear-gradient(135deg,#dbeafe,#d1fae5);}
  .yt-btn{width:64px;height:44px;background:var(--primary);border-radius:12px/10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(63,124,184,.35);position:relative;}
  .card.intro .yt-btn{background:var(--accent);}
  .play-tri{width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:15px solid #fff;margin-right:3px;}

  .badge{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:var(--grad-hero);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;box-shadow:0 2px 8px rgba(63,124,184,.35);}
  .card-label{font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;color:var(--text);text-align:center;}
  .card-hint{font-size:12px;color:var(--muted);text-align:center;line-height:1.4;}

  .divider{height:1px;background:var(--border);margin:28px 0;}
  footer{text-align:center;font-size:13px;color:var(--muted);padding:24px 0 40px;font-weight:600;}

  @media(max-width:480px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
    .play-wrap{width:66px;height:66px;}
    .yt-btn{width:52px;height:36px;}
    .hero-banner{padding:28px 16px 38px;}
  }
  .topbar-logo-wrap{display:flex;align-items:center;gap:10px;}
  .topbar-logo-wrap img{height:34px;flex-shrink:0;opacity:.92;} .topbar-title-wrap{display:flex;flex-direction:column;} .topbar-sub{font-size:12px;opacity:.85;margin-top:1px;font-weight:500;}
  
  .tb-user-chip{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:5px 12px;font-size:12px;font-family:inherit;font-weight:700;display:none;align-items:center;gap:5px;max-width:150px;overflow:hidden;white-space:nowrap;}
  .tb-user-chip::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#a3e635;flex-shrink:0;}

<script>
(function(){
  try {
    var c=document.getElementById('tb-user-chip');
    var name='';
    var sources=[sessionStorage.getItem('lg_session_student'), localStorage.getItem('lg_xsession_student'), localStorage.getItem('lg_remember_student')];
    for (var i=0;i<sources.length;i++) {
      if (!sources[i]) continue;
      try { var sd=JSON.parse(sources[i]); if (sd && (sd.name||sd.admin_name)) { name=sd.name||sd.admin_name; break; } } catch(e2){}
    }
    if (!name) {
      const a = localStorage.getItem('lg_academic_user');
      const d = a ? JSON.parse(a) : null;
      if (d && d.name) name = d.name;
    }
    if (name) {
      c.textContent=name; c.style.display='inline-flex';
      localStorage.setItem('lg_academic_user', JSON.stringify({ name: name }));
    }
  } catch(e){}
})();
</script>
