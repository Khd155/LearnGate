  h1,h2{font-family:'Cairo','Tajawal',sans-serif;font-weight:800;}

  .topbar{background:var(--grad);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 6px 24px -10px rgba(7,54,105,.55);min-height:64px;}

  .hero-banner{background:var(--grad);color:#fff;padding:36px 24px 48px;text-align:center;position:relative;overflow:hidden;}
  .hero-banner::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 120%,rgba(255,255,255,.12),transparent 70%);pointer-events:none;}

  .hero-banner p{font-size:15px;opacity:.88;font-weight:500;}
  .hero-pill{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:4px 18px;font-size:13px;font-weight:700;margin-bottom:12px;}

  .container{max-width:1100px;margin:0 auto;padding:32px 20px 60px;}
  .section-header{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .section-header h2{font-size:18px;color:var(--primary);}
  .count-badge{background:var(--primary);color:#fff;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:700;}

  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}

  a.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px 12px;aspect-ratio:1/1;text-decoration:none;color:var(--text);background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s;position:relative;}
  a.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--primary);}
  a.card.soon{opacity:.42;pointer-events:none;box-shadow:none;}

  .card-num{width:52px;height:52px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-family:'Cairo',sans-serif;font-size:22px;font-weight:800;color:#fff;box-shadow:0 4px 12px rgba(63,124,184,.35);}
  .card-label{font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;text-align:center;}
  .card-hint{font-size:11px;color:var(--muted);text-align:center;}
  a.card.soon .card-num{background:var(--border);box-shadow:none;}

  .divider{height:1px;background:var(--border);margin:28px 0;}
  footer{text-align:center;font-size:13px;color:var(--muted);padding:24px 0 40px;font-weight:600;}

  @media(max-width:480px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;}
    .hero-banner{padding:28px 16px 38px;}

  .tb-user-chip::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#a3e635;flex-shrink:0;}

  document.getElementById('hero-title').textContent   = `اختبارات ${meta.title}`;
  document.getElementById('hero-sub').textContent     = `${urls.length >= 3 && urls.length <= 10 ? urls.length + ' اختبارات تدريبية' : urls.length + ' اختبار تدريبي'} — اختر رقم الاختبار`;
  document.getElementById('active-count').textContent = urls.length;

  const total = Math.max(urls.length, TOTAL_CARDS);
  const grid  = document.getElementById('quiz-grid');
  grid.innerHTML = Array.from({ length: total }, (_, i) => {
    const url  = urls[i];
    const num  = i + 1;
    const hint = HINTS[i % HINTS.length];
    if (url) {
      return `<a class="card" href="${url}" target="_blank" rel="noopener">
        <div class="card-num">${num}</div>
        <div class="card-label">اختبار ${num}</div>
        <div class="card-hint">${hint}</div>
      </a>`;
    }
    return `<a class="card soon" href="#" tabindex="-1">
      <div class="card-num">${num}</div>
      <div class="card-label">اختبار ${num}</div>
      <div class="card-hint">قريباً</div>
    </a>`;
  }).join('');
})();
</script>
<script>
(function(){
  try {
    var c=document.getElementById('tb-user-chip');
    var name='';
    var sources=[sessionStorage.getItem('lg_session_student'), localStorage.getItem('lg_xsession_student'), localStorage.getItem('lg_remember_student')];
    for (var i=0;i<sources.length;i++) {
      if (!sources[i]) continue;
      try { var sd=JSON.parse(sources[i]); if (sd && (sd.name||sd.admin_name)) { name=sd.name||sd.admin_name; break; } } catch(e2){}
    }
    if (!name) {
      const a = localStorage.getItem('lg_academic_user');
      const d = a ? JSON.parse(a) : null;
      if (d && d.name) name = d.name;
    }
    if (name) {
      c.textContent=name; c.style.display='inline-flex';
      localStorage.setItem('lg_academic_user', JSON.stringify({ name: name }));
    }
  } catch(e){}
})();
</script>
</body>
