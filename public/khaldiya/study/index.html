<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="icon" type="image/png" href="/logo.png">
<script>!function(){try{var s=sessionStorage.getItem("lg_session_student")||localStorage.getItem("lg_xsession_student");var d=s?JSON.parse(s):null;if(d&&d.token&&d.role==="student"&&d.expiry&&Date.now()<d.expiry)return;var r=localStorage.getItem("lg_remember_student");var rd=r?JSON.parse(r):null;if(rd&&rd.code&&rd.role==="student"&&rd.expiry&&Date.now()<rd.expiry)return;}catch(e){}window.location.replace("/");}();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الشروحات والاختبارات — بوابة دعم التعلم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#3F7CB8;--accent:#4FA877;
  --bg:#f4f8fb;--surface:#fff;--border:#e2e8f0;
  --text:#0f172a;--muted:#64748b;
  --grad:linear-gradient(135deg,#3F7CB8 0%,#4A96A0 55%,#4FA877 100%);
  --shadow:0 8px 24px -8px rgba(63,124,184,.20),0 2px 6px rgba(15,23,42,.04);
  --shadow-lg:0 24px 60px -20px rgba(63,124,184,.30);
  --radius:18px;
}
html,body{min-height:100vh;font-family:'Tajawal','Cairo',sans-serif;background:var(--bg);color:var(--text);direction:rtl;font-size:16px;font-weight:500;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Cairo','Tajawal',sans-serif;font-weight:800;}

.topbar{background:var(--grad);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 6px 24px -10px rgba(7,54,105,.55);min-height:64px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-logo{height:34px;opacity:.92;flex-shrink:0;}
.topbar-title-wrap{display:flex;flex-direction:column;}
.topbar-title{font-family:'Cairo',sans-serif;font-weight:800;font-size:17px;letter-spacing:-0.01em;}
.topbar-sub{font-size:12px;opacity:.85;margin-top:1px;font-weight:500;}
.topbar-back{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:99px;padding:6px 18px;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .18s;flex-shrink:0;white-space:nowrap;text-decoration:none;}
.topbar-back:hover{background:rgba(255,255,255,.28);}
.tb-user-chip{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:5px 12px;font-size:12px;font-family:inherit;font-weight:700;display:none;align-items:center;gap:5px;max-width:160px;overflow:hidden;white-space:nowrap;}
.tb-user-chip::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#a3e635;flex-shrink:0;}

.hero{background:var(--grad);color:#fff;padding:32px 20px 44px;text-align:center;position:relative;overflow:hidden;}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 120%,rgba(255,255,255,.12),transparent 70%);pointer-events:none;}
.hero-pill{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:4px 18px;font-size:13px;font-weight:700;margin-bottom:12px;}
.hero h1{font-size:clamp(20px,4vw,30px);text-shadow:0 3px 12px rgba(7,54,105,.3);margin-bottom:8px;line-height:1.3;}
.hero p{font-size:14px;opacity:.88;}

.container{max-width:640px;margin:0 auto;padding:30px 18px 60px;}

.choice-btn{
  display:flex;align-items:center;gap:16px;width:100%;
  background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
  padding:22px 22px;text-align:right;cursor:pointer;transition:all .18s;
  font-family:inherit;margin-bottom:16px;box-shadow:var(--shadow);
}
.choice-btn:hover{border-color:var(--primary);background:#f0f6ff;transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.choice-btn.quant:hover{border-color:var(--accent);background:#f0fbf5;}
.choice-icon-wrap{
  font-size:30px;flex-shrink:0;width:60px;height:60px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  background:var(--grad);box-shadow:0 4px 14px rgba(63,124,184,.3);
}
.choice-btn.quant .choice-icon-wrap{background:linear-gradient(135deg,#4FA877,#4A96A0);}
.choice-content{text-align:right;}
.choice-title{display:block;font-size:17px;font-weight:800;color:var(--text);margin-bottom:4px;}
.choice-desc{display:block;font-size:13px;font-weight:500;color:var(--muted);line-height:1.5;}

footer{text-align:center;font-size:13px;color:var(--muted);padding:20px 0 36px;font-weight:600;}

@media(max-width:560px){
  .topbar{padding:10px 14px;gap:8px;}
  .topbar-title{font-size:15px;}
  .tb-user-chip{display:none!important;}
  .container{padding:18px 14px 50px;}
  .hero{padding:24px 16px 34px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-right">
    <img class="topbar-logo" src="../logo-white.png" alt="">
    <div class="topbar-title-wrap">
      <div class="topbar-title">الشروحات والاختبارات</div>
      <div class="topbar-sub">بوابة دعم التعلم</div>
    </div>
    <span class="tb-user-chip" id="tb-user-chip"></span>
  </div>
  <a class="topbar-back" href="../index.html">رجوع</a>
</div>

<div class="hero">
  <div class="hero-pill">📚 المكتبة التعليمية</div>
  <h1>بين يديك المقاطع والاختبارات</h1>
  <p>اختر نوع المحتوى الذي تريد تصفّحه</p>
</div>

<div class="container">
  <button class="choice-btn" onclick="location.href='../lessons/index.html'">
    <div class="choice-icon-wrap">📖</div>
    <div class="choice-content">
      <span class="choice-title">الشروحات</span>
      <span class="choice-desc">مقاطع وشروحات مرئية لكل مهارة من المهارات اللفظية والكمية</span>
    </div>
  </button>
  <button class="choice-btn quant" onclick="location.href='../quizzes/index.html'">
    <div class="choice-icon-wrap">✏️</div>
    <div class="choice-content">
      <span class="choice-title">الاختبارات التدريبية</span>
      <span class="choice-desc">اختبارات تدريبية لقياس مستواك وتعزيز مهاراتك</span>
    </div>
  </button>

  <footer>بوابة دعم التعلم — ثانوية الخالدية</footer>
</div>

<script>
(function(){
  try {
    const s = sessionStorage.getItem('lg_session_student') || localStorage.getItem('lg_xsession_student');
    const d = s ? JSON.parse(s) : null;
    if (d && d.name) { var c=document.getElementById('tb-user-chip'); c.textContent=d.name; c.style.display='inline-flex'; return; }
    const r = localStorage.getItem('lg_remember_student');
    const rd = r ? JSON.parse(r) : null;
    if (rd && rd.name) { var c=document.getElementById('tb-user-chip'); c.textContent=rd.name; c.style.display='inline-flex'; }
  } catch(e){}
})();
</script>
</body>
</html>
