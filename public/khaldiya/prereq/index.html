<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تمهيد وتهيئة المقرر — بوابة دعم التعلم</title>
<script>if ('scrollRestoration' in history) history.scrollRestoration = 'manual';</script>
<script>!function(){try{var s=sessionStorage.getItem("lg_session_student")||localStorage.getItem("lg_xsession_student");var d=s?JSON.parse(s):null;if(d&&d.token&&d.role==="student"&&d.expiry&&Date.now()<d.expiry)return;var r=localStorage.getItem("lg_remember_student");var rd=r?JSON.parse(r):null;if(rd&&rd.code&&rd.role==="student"&&rd.expiry&&Date.now()<rd.expiry)return;}catch(e){}window.location.replace("/");}();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #0a0f1d;
    --bg-1: #0d1426;
    --card: rgba(17, 25, 46, 0.62);
    --card-solid: #111a30;
    --border: rgba(148, 163, 209, 0.14);
    --border-strong: rgba(96, 165, 250, 0.28);
    --text: #E7ECFB;
    --text-dim: #9AA7C7;
    --muted: #6E7A9B;
    --blue: #3B82F6;
    --blue-dk: #1D4ED8;
    --indigo: #6366F1;
    --cyan: #22D3EE;
    --violet: #A78BFA;
    --amber: #F59E0B;
    --emerald: #34D399;
    --danger: #F87171;
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans Arabic', 'Tahoma', sans-serif;
    background: var(--bg-0);
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(59,130,246,0.22), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(99,102,241,0.16), transparent 55%),
      radial-gradient(ellipse 800px 600px at 50% 100%, rgba(34,211,238,0.08), transparent 60%);
    background-attachment: fixed;
  }

  .topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:rgba(10,15,29,0.75); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20; }
  .topbar h1 { font-size:14.5px; margin:0; font-weight:700; color:var(--text-dim); letter-spacing:.02em; }
  .back-btn { background:rgba(148,163,209,0.08); border:1px solid var(--border); border-radius:10px; padding:7px 14px; font-size:13px; color:var(--text); cursor:pointer; transition:.15s; }
  .back-btn:hover { background:rgba(148,163,209,0.16); border-color:var(--border-strong); }

  .wrap { max-width: 920px; margin: 0 auto; padding: 24px 18px 70px; }
  .screen { display:none; }
  .screen.active { display:block; animation: fade .3s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  @keyframes pulse-glow { 0%,100%{ box-shadow:0 0 0 0 rgba(59,130,246,0.5), 0 8px 30px -6px rgba(59,130,246,.55);} 50%{ box-shadow:0 0 0 10px rgba(59,130,246,0), 0 8px 30px -6px rgba(59,130,246,.75);} }
  @keyframes dot-pulse { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.55; transform:scale(1.25);} }

  /* ── Hero ── */
  .hero { position:relative; border-radius:24px; padding:30px 26px; margin-bottom:22px; overflow:hidden;
    background: rgba(17,25,46,0.6); border:1px solid var(--border-strong); backdrop-filter: blur(16px); }
  .hero::before { content:''; position:absolute; inset:-40% -20% auto auto; width:340px; height:340px; border-radius:50%;
    background:radial-gradient(circle, rgba(59,130,246,.35), transparent 70%); pointer-events:none; }
  .hero::after { content:''; position:absolute; inset:auto auto -50% -10%; width:300px; height:300px; border-radius:50%;
    background:radial-gradient(circle, rgba(167,139,250,.22), transparent 70%); pointer-events:none; }
  .hero-top { display:flex; align-items:center; gap:14px; margin-bottom:14px; position:relative; }
  .hero-icon { width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:26px;
    background:linear-gradient(135deg, rgba(59,130,246,.25), rgba(99,102,241,.25)); border:1px solid var(--border-strong); flex-shrink:0; }
  .hero h2 { margin:0; font-size:21px; font-weight:800; background:linear-gradient(90deg,#fff,#B9C6EE); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p { margin:0; font-size:14px; line-height:2; color:var(--text-dim); position:relative; max-width:640px; }

  .section-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:18px; backdrop-filter:blur(12px); }
  .section-card h3 { margin:0 0 16px; font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .section-card h3 .dot { width:6px; height:6px; border-radius:50%; background:var(--blue); box-shadow:0 0 8px var(--blue); }

  /* ── Journey roadmap ── */
  .roadmap { position:relative; display:flex; flex-direction:column; gap:0; }
  .roadmap-row { display:flex; align-items:stretch; gap:14px; position:relative; }
  .roadmap-track { width:28px; display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
  .roadmap-node { width:14px; height:14px; border-radius:50%; background:#3A4568; border:2px solid #4A5580; margin-top:22px; flex-shrink:0; position:relative; z-index:2; }
  .roadmap-node.status-mastered { background:var(--emerald); border-color:var(--emerald); box-shadow:0 0 10px rgba(52,211,153,.6); }
  .roadmap-node.status-needs_review { background:var(--amber); border-color:var(--amber); box-shadow:0 0 10px rgba(245,158,11,.6); animation:dot-pulse 1.8s ease-in-out infinite; }
  .roadmap-line { width:2px; flex:1; background:linear-gradient(to bottom, #3A4568, #262E4A); margin-top:2px; min-height:26px; }
  .roadmap-row:last-child .roadmap-line { display:none; }
  .roadmap-card-wrap { flex:1; padding-bottom:14px; }

  .chapter-card { position:relative; border-radius:16px; padding:16px 18px; border:1px solid var(--border); background:rgba(22,30,54,0.65);
    cursor:pointer; transition:.2s; box-shadow:0 10px 24px -12px rgba(0,0,0,.5); }
  .chapter-card:hover { transform:translateY(-3px); border-color:var(--border-strong); box-shadow:0 16px 30px -10px rgba(59,130,246,.25); }
  .chapter-card.status-mastered { border-color:rgba(52,211,153,.4); background:linear-gradient(135deg, rgba(52,211,153,.08), rgba(22,30,54,.65)); }
  .chapter-card.status-needs_review { border-color:rgba(245,158,11,.4); background:linear-gradient(135deg, rgba(245,158,11,.09), rgba(22,30,54,.65)); }
  .chapter-card-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .chapter-num { font-size:11px; font-weight:700; color:var(--muted); }
  .chapter-status-icon { font-size:15px; line-height:1; }
  .layer-pill { display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:99px; border:1px solid; }
  .layer-foundational { color:#7DD3FC; border-color:rgba(125,211,252,.4); background:rgba(125,211,252,.08); }
  .layer-descriptive { color:#C4B5FD; border-color:rgba(196,181,253,.4); background:rgba(196,181,253,.08); }
  .layer-structural { color:#93C5FD; border-color:rgba(147,197,253,.4); background:rgba(147,197,253,.08); }
  .layer-reactive { color:#FCD34D; border-color:rgba(252,211,77,.4); background:rgba(252,211,77,.08); }
  .layer-quantitative { color:#6EE7B7; border-color:rgba(110,231,183,.4); background:rgba(110,231,183,.08); }
  .chapter-card .title { font-size:15.5px; font-weight:800; margin:2px 0 6px; color:#F3F6FF; }
  .chapter-card .deps { font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:5px; }
  .chapter-card .deps b { color:var(--text-dim); font-weight:600; }

  /* ── Prerequisites grid ── */
  .prereq-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:600px) { .prereq-grid { grid-template-columns:1fr; } }
  .prereq-card { border-radius:14px; padding:14px 16px; background:rgba(22,30,54,0.6); border:1px solid var(--border); }
  .prereq-card .p-name { font-size:13.5px; font-weight:700; color:#F3F6FF; margin-bottom:8px; line-height:1.6; }
  .prereq-card .p-src { display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:3px 9px; border-radius:99px; background:rgba(59,130,246,.1); color:#93C5FD; border:1px solid rgba(59,130,246,.25); margin-bottom:8px; }
  .prereq-card .p-used { font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:5px; }
  .prereq-card .p-used b { color:var(--cyan); font-weight:700; }

  /* ── CTA ── */
  .cta-btn { position:relative; display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    background:linear-gradient(90deg, var(--blue), var(--indigo)); color:#fff; border:none; border-radius:16px;
    padding:17px 20px; font-size:15.5px; font-weight:800; cursor:pointer; animation:pulse-glow 2.6s ease-in-out infinite; }
  .cta-btn:hover { filter:brightness(1.08); }
  .cta-btn:disabled { opacity:.45; cursor:not-allowed; animation:none; }
  .ghost-btn { background:rgba(148,163,209,0.08); border:1px solid var(--border); color:var(--text); border-radius:14px; padding:13px 18px; font-size:13.5px; cursor:pointer; transition:.15s; }
  .ghost-btn:hover { background:rgba(148,163,209,0.16); border-color:var(--border-strong); }

  /* ── DiagnosticEngine ── */
  .q-progress { font-size:12px; color:var(--muted); margin-bottom:12px; font-weight:600; letter-spacing:.02em; }
  .q-prompt { font-size:17px; font-weight:700; margin-bottom:20px; line-height:1.8; color:#F3F6FF; }
  .option-btn { display:block; width:100%; text-align:right; background:rgba(22,30,54,0.7); border:1.5px solid var(--border); color:var(--text);
    border-radius:14px; padding:14px 18px; font-size:14px; margin-bottom:11px; cursor:pointer; transition:.15s; font-family:inherit; }
  .option-btn:hover:not(:disabled) { border-color:var(--border-strong); background:rgba(30,40,68,0.8); }
  .option-btn:disabled { cursor:default; }
  .option-btn.correct { background:rgba(52,211,153,.12); border-color:var(--emerald); }
  .option-btn.incorrect { background:rgba(248,113,113,.12); border-color:var(--danger); }
  .option-feedback { font-size:12.5px; margin:-4px 0 11px; padding:10px 14px; border-radius:10px; line-height:1.8; display:none; }
  .option-btn.correct + .option-feedback, .option-btn.incorrect + .option-feedback { display:block; }
  .option-feedback.fb-correct { background:rgba(52,211,153,.08); color:#6EE7B7; border:1px solid rgba(52,211,153,.25); }
  .option-feedback.fb-incorrect { background:rgba(248,113,113,.08); color:#FCA5A5; border:1px solid rgba(248,113,113,.25); }

  /* ── ResultBranchBox ── */
  .branch-box { text-align:center; padding:30px 18px; }
  .branch-icon { font-size:46px; margin-bottom:14px; filter:drop-shadow(0 4px 12px rgba(59,130,246,.3)); }
  .branch-title { font-size:19px; font-weight:800; margin-bottom:10px; color:#F3F6FF; }
  .branch-desc { font-size:13.5px; color:var(--text-dim); line-height:1.9; margin-bottom:20px; }
  .capsule-item { background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.3); border-radius:14px; padding:13px 16px; margin-bottom:10px; text-align:right; font-size:13px; color:#FDE68A; }

  /* ── ChapterSummaryPanel ── */
  .summary-grid { display:grid; gap:12px; }
  .summary-block { background:rgba(22,30,54,0.6); border:1px solid var(--border); border-radius:14px; padding:16px; }
  .summary-block h4 { margin:0 0 10px; font-size:13px; color:var(--cyan); font-weight:700; }
  .chip { display:inline-block; background:rgba(59,130,246,.1); border:1px solid rgba(59,130,246,.25); color:#93C5FD; border-radius:99px; padding:5px 12px; font-size:12px; margin:3px; }
  .term-item { font-size:13px; margin-bottom:8px; line-height:1.7; color:var(--text-dim); }
  .term-item b { color:var(--text); }

  .eval-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:600px) { .eval-grid { grid-template-columns:1fr; } }
  .eval-card { border-radius:16px; padding:18px; border:1px solid; }
  .eval-card.knowledge { background:rgba(59,130,246,.07); border-color:rgba(59,130,246,.3); }
  .eval-card.higher_order { background:rgba(167,139,250,.08); border-color:rgba(167,139,250,.32); }
  .eval-card .eval-level { font-size:11px; font-weight:800; margin-bottom:10px; text-transform:uppercase; letter-spacing:.03em; }
  .eval-card.knowledge .eval-level { color:#93C5FD; }
  .eval-card.higher_order .eval-level { color:#C4B5FD; }
  .eval-card .eval-prompt { font-size:13.5px; line-height:1.85; color:var(--text); }
  .reveal-btn { margin-top:12px; font-size:12px; background:none; border:none; color:var(--cyan); cursor:pointer; font-weight:600; padding:0; }
  .model-answer { margin-top:10px; font-size:12.5px; background:rgba(0,0,0,.25); border-radius:10px; padding:12px 14px; display:none; line-height:1.8; color:var(--text-dim); }

  .loading { text-align:center; padding:60px 20px; color:var(--muted); font-size:13px; }
  .loading .spinner { width:34px; height:34px; border-radius:50%; border:3px solid rgba(59,130,246,.2); border-top-color:var(--blue); margin:0 auto 14px; animation:spin 0.9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="location.href='/'">→ رجوع</button>
  <h1 id="topbar-title">تمهيد المقرر</h1>
  <span style="width:60px"></span>
</div>

<div class="wrap">
  <div id="loading" class="loading"><div class="spinner"></div>جارٍ التحميل...</div>

  <!-- Screen 1+2: Intro + Chapter roadmap -->
  <div id="screen-intro" class="screen">
    <div class="hero">
      <div class="hero-top">
        <div class="hero-icon">🧪</div>
        <h2 id="hero-title"></h2>
      </div>
      <p id="hero-intro"></p>
    </div>

    <div class="section-card">
      <h3><span class="dot"></span>مسار الرحلة التعليمية — فصول المقرر وعلاقاتها</h3>
      <div id="chapter-map" class="roadmap"></div>
    </div>

    <div id="subject-prereqs-card" class="section-card">
      <h3><span class="dot"></span>المتطلبات القبلية على مستوى المادة</h3>
      <div id="subject-prereqs-list" class="prereq-grid"></div>
    </div>

    <div id="intro-cta">
      <button class="cta-btn" onclick="Prereq.startSubjectDiagnostic()">
        <span>🧭</span> ابدأ رحلة التشخيص واستكشف مستواك الآن 🚀
      </button>
    </div>
  </div>

  <!-- Screen 3/4: Diagnostic engine -->
  <div id="screen-diagnostic" class="screen">
    <div class="section-card">
      <div class="q-progress" id="q-progress"></div>
      <div class="q-prompt" id="q-prompt"></div>
      <div id="q-options"></div>
      <button class="cta-btn" id="q-next-btn" style="display:none;margin-top:8px" onclick="Prereq.nextQuestion()">التالي ←</button>
    </div>
  </div>

  <!-- Screen: Result branch -->
  <div id="screen-result" class="screen">
    <div class="section-card branch-box" id="branch-box"></div>
  </div>

  <!-- Screen: Chapter summary + evaluation -->
  <div id="screen-summary" class="screen">
    <div class="section-card">
      <h3><span class="dot"></span>ملخص الفصل</h3>
      <div id="summary-grid" class="summary-grid"></div>
    </div>
    <div class="section-card">
      <h3><span class="dot"></span>أسئلة تقويمية</h3>
      <div id="eval-grid" class="eval-grid"></div>
    </div>
    <button class="ghost-btn" style="width:100%" onclick="Prereq.backToMap()">↩ العودة لمسار الرحلة</button>
  </div>
</div>

<script>
const API = '';
function getStudentSession() {
  try {
    const raw = sessionStorage.getItem('lg_session_student') || localStorage.getItem('lg_xsession_student');
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function apiFetch(path, opts = {}) {
  const sess = getStudentSession();
  return fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(sess?.token ? { Authorization: 'Bearer ' + sess.token } : {}), ...(opts.headers || {}) },
  }).then(async (r) => {
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    return d;
  });
}

const LAYER_LABELS = { foundational: 'تأسيسي', descriptive: 'وصفي', structural: 'تركيبي', reactive: 'تفاعلي', quantitative: 'كمّي' };
const STATUS_ICON = { default: '🎯', mastered: '✅', needs_review: '🟠' };
const SOURCE_ICON = { 'علوم': '📘', 'رياضيات': '📐' };

const Prereq = {
  subjectId: null,
  overview: null,
  currentDiagnostic: null, // { scope, chapterId, questions, index, weakLabels }

  async init() {
    const params = new URLSearchParams(location.search);
    this.subjectId = params.get('subject') || 'chemistry-1';
    const sess = getStudentSession();
    if (!sess) { location.replace('/'); return; }
    try {
      this.overview = await apiFetch(`/api/prereq/overview?subject=${encodeURIComponent(this.subjectId)}`);
    } catch (e) {
      document.getElementById('loading').innerHTML = 'تعذّر تحميل بيانات المقرر: ' + e.message;
      return;
    }
    document.getElementById('loading').style.display = 'none';
    document.getElementById('topbar-title').textContent = this.overview.subject.title;
    document.getElementById('hero-title').textContent = `${this.overview.subject.title}: رحلة استكشاف المادة`;
    document.getElementById('hero-intro').textContent = this.overview.subject.intro;
    this.renderChapterMap();
    this.renderSubjectPrereqs();

    if (this.overview.seenIntro) {
      document.getElementById('intro-cta').innerHTML =
        '<p style="text-align:center;color:var(--muted);font-size:13px">أنجزت تشخيص المتطلبات القبلية لهذه المادة من قبل — اختر فصلاً من المسار أعلاه للمتابعة.</p>';
    }
    this.showScreen('screen-intro');
  },

  renderChapterMap() {
    const el = document.getElementById('chapter-map');
    el.innerHTML = this.overview.chapters.map((c, i) => `
      <div class="roadmap-row">
        <div class="roadmap-track">
          <div class="roadmap-node status-${c.status}"></div>
          <div class="roadmap-line"></div>
        </div>
        <div class="roadmap-card-wrap">
          <div class="chapter-card" onclick="Prereq.openChapter('${c.chapterId}')">
            <div class="chapter-card-top">
              <span class="chapter-num">فصل ${c.orderNum}</span>
              <span class="chapter-status-icon">${STATUS_ICON[c.status] || '🎯'}</span>
            </div>
            <span class="layer-pill layer-${c.layer}">${LAYER_LABELS[c.layer] || c.layer}</span>
            <div class="title">${escapeHtml(c.title)}</div>
            <div class="deps">${c.dependsOn.length ? '🔗 يعتمد على: <b>' + c.dependsOn.map(depId => {
              const dep = this.overview.chapters.find(x => x.chapterId === depId);
              return dep ? 'الفصل ' + dep.orderNum : '';
            }).filter(Boolean).join(' و ') + '</b>' : '✨ بداية المقرر'}</div>
          </div>
        </div>
      </div>
    `).join('');
  },

  renderSubjectPrereqs() {
    const list = this.overview.subject.subjectPrereqs || [];
    const card = document.getElementById('subject-prereqs-card');
    if (!list.length) { card.style.display = 'none'; return; }
    document.getElementById('subject-prereqs-list').innerHTML = list.map(p => {
      const icon = Object.keys(SOURCE_ICON).find(k => p.source.includes(k));
      return `
      <div class="prereq-card">
        <div class="p-name">${escapeHtml(p.label)}</div>
        <span class="p-src">${icon ? SOURCE_ICON[icon] : '📎'} ${escapeHtml(p.source)}</span>
        <div class="p-used">➜ يخدم <b>${escapeHtml(p.usedIn)}</b></div>
      </div>`;
    }).join('');
  },

  openChapter(chapterId) {
    this.startChapterDiagnostic(chapterId);
  },

  async startSubjectDiagnostic() {
    await this._loadDiagnostic('subject', null);
  },
  async startChapterDiagnostic(chapterId) {
    await this._loadDiagnostic('chapter', chapterId);
  },

  async _loadDiagnostic(scope, chapterId) {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('loading').innerHTML = '<div class="spinner"></div>جارٍ التحميل...';
    try {
      const qs = `subject=${encodeURIComponent(this.subjectId)}&scope=${scope}` + (chapterId ? `&chapterId=${encodeURIComponent(chapterId)}` : '');
      const data = await apiFetch(`/api/prereq/diagnostic?${qs}`);
      this.currentDiagnostic = { scope, chapterId, questions: data.questions, index: 0, weakLabels: [] };
      document.getElementById('loading').style.display = 'none';
      this.showScreen('screen-diagnostic');
      this.renderQuestion();
    } catch (e) {
      document.getElementById('loading').innerHTML = 'تعذّر تحميل التشخيص: ' + e.message;
    }
  },

  renderQuestion() {
    const d = this.currentDiagnostic;
    const q = d.questions[d.index];
    document.getElementById('q-progress').textContent = `سؤال ${d.index + 1} من ${d.questions.length}`;
    document.getElementById('q-prompt').textContent = q.prompt;
    document.getElementById('q-next-btn').style.display = 'none';
    document.getElementById('q-options').innerHTML = q.options.map((o, i) => `
      <div>
        <button class="option-btn" onclick="Prereq.answer(${i})">${escapeHtml(o.text)}</button>
        <div class="option-feedback" id="fb-${i}">${escapeHtml(o.feedback || '')}</div>
      </div>
    `).join('');
  },

  answer(optionIndex) {
    const d = this.currentDiagnostic;
    const q = d.questions[d.index];
    const buttons = document.querySelectorAll('#q-options .option-btn');
    if (buttons[0].disabled) return; // already answered
    const chosen = q.options[optionIndex];
    buttons.forEach((btn, i) => {
      btn.disabled = true;
      const opt = q.options[i];
      if (opt.is_correct) btn.classList.add('correct');
      else if (i === optionIndex) btn.classList.add('incorrect');
      const fb = document.getElementById('fb-' + i);
      if (i === optionIndex || opt.is_correct) {
        fb.classList.add(opt.is_correct ? 'fb-correct' : 'fb-incorrect');
      }
    });
    if (!chosen.is_correct) d.weakLabels.push(q.prerequisiteLabel);
    document.getElementById('q-next-btn').style.display = 'flex';
    document.getElementById('q-next-btn').innerHTML = d.index + 1 < d.questions.length ? '<span>التالي ←</span>' : '<span>عرض النتيجة ←</span>';
  },

  async nextQuestion() {
    const d = this.currentDiagnostic;
    d.index++;
    if (d.index < d.questions.length) { this.renderQuestion(); return; }
    await this.submitDiagnostic();
  },

  async submitDiagnostic() {
    const d = this.currentDiagnostic;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('loading').innerHTML = '<div class="spinner"></div>جارٍ حساب النتيجة...';
    try {
      const result = await apiFetch('/api/prereq/diagnostic/submit', {
        method: 'POST',
        body: JSON.stringify({ subjectId: this.subjectId, scope: d.scope, chapterId: d.chapterId, weakLabels: d.weakLabels }),
      });
      document.getElementById('loading').style.display = 'none';
      this.renderBranch(result, d);
      this.showScreen('screen-result');
    } catch (e) {
      document.getElementById('loading').innerHTML = 'تعذّر إرسال النتيجة: ' + e.message;
    }
  },

  renderBranch(result, d) {
    const box = document.getElementById('branch-box');
    const chapterId = d.chapterId;
    const startLabel = chapterId ? 'ابدأ الفصل' : 'استمر إلى فصول المقرر';
    const startAction = chapterId ? `Prereq.finishChapterStudy('${chapterId}')` : `Prereq.backToMap()`;
    if (result.branch === 'direct') {
      box.innerHTML = `
        <div class="branch-icon">✅</div>
        <div class="branch-title">ممتاز — كل متطلباتك جاهزة</div>
        <div class="branch-desc">أجبت بشكل صحيح على كل أسئلة التشخيص. يمكنك الدخول مباشرة دون أي محتوى علاجي إضافي.</div>
        <button class="cta-btn" onclick="${startAction}">${startLabel}</button>`;
    } else if (result.branch === 'capsule') {
      box.innerHTML = `
        <div class="branch-icon">💊</div>
        <div class="branch-title">كبسولة علاجية مصغّرة</div>
        <div class="branch-desc">وجدنا ${result.weakCount} من ${result.totalCount} متطلبات تحتاج مراجعة سريعة قبل المتابعة:</div>
        ${result.weakLabels.map(l => `<div class="capsule-item">📌 ${escapeHtml(l)} — راجع هذا المفهوم مع معلمك أو من مصدره الأساسي قبل المتابعة (~5 دقائق).</div>`).join('')}
        <button class="cta-btn" style="margin-top:8px" onclick="${startAction}">${startLabel}</button>`;
    } else {
      box.innerHTML = `
        <div class="branch-icon">🔔</div>
        <div class="branch-title">تم تسجيل تنبيه لمعلمك</div>
        <div class="branch-desc">ضعفك في أغلب المتطلبات القبلية (${result.weakCount} من ${result.totalCount}) — تم إشعار معلمك بذلك تلقائياً، ويمكنك المتابعة اختيارياً.</div>
        <button class="cta-btn" onclick="${startAction}">${startLabel}</button>`;
    }
  },

  async finishChapterStudy(chapterId) {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('loading').innerHTML = '<div class="spinner"></div>جارٍ التحميل...';
    try {
      const data = await apiFetch(`/api/prereq/chapter-summary?chapterId=${encodeURIComponent(chapterId)}`);
      document.getElementById('loading').style.display = 'none';
      this.renderSummary(data);
      this.showScreen('screen-summary');
    } catch (e) {
      // No summary content yet for this chapter (only chapter 3 is seeded as
      // the reference model) — go back to the roadmap rather than dead-end.
      document.getElementById('loading').style.display = 'none';
      this.backToMap();
    }
  },

  renderSummary(data) {
    const s = data.summary;
    document.getElementById('summary-grid').innerHTML = `
      <div class="summary-block"><h4>المفاهيم الأساسية</h4>${s.keyConcepts.map(c => `<span class="chip">${escapeHtml(c)}</span>`).join('')}</div>
      <div class="summary-block"><h4>مصطلحات جديدة</h4>${s.newTerms.map(t => `<div class="term-item"><b>${escapeHtml(t.term)}</b> — ${escapeHtml(t.definition)}</div>`).join('')}</div>
      <div class="summary-block"><h4>القانون الأساسي</h4><div class="term-item">${escapeHtml(s.coreRule)}</div></div>
      <div class="summary-block"><h4>مثال محلول</h4><div class="term-item">${escapeHtml(s.workedExample)}</div></div>
      <div class="summary-block"><h4>خطأ شائع</h4><div class="term-item">${escapeHtml(s.commonPitfall)}</div></div>
    `;
    document.getElementById('eval-grid').innerHTML = data.evaluationQuestions.map((q, i) => `
      <div class="eval-card ${q.level}">
        <div class="eval-level">${q.level === 'knowledge' ? '🧠 معرفي' : '💡 مهارات تفكير عليا'}</div>
        <div class="eval-prompt">${escapeHtml(q.prompt)}</div>
        <button class="reveal-btn" onclick="Prereq.toggleAnswer(${i})">عرض الإجابة النموذجية ↓</button>
        <div class="model-answer" id="model-answer-${i}">${escapeHtml(q.modelAnswer)}</div>
      </div>
    `).join('');
  },

  toggleAnswer(i) {
    const el = document.getElementById('model-answer-' + i);
    el.style.display = el.style.display === 'block' ? 'none' : 'block';
  },

  async backToMap() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('loading').innerHTML = '<div class="spinner"></div>جارٍ التحميل...';
    try {
      this.overview = await apiFetch(`/api/prereq/overview?subject=${encodeURIComponent(this.subjectId)}`);
      document.getElementById('loading').style.display = 'none';
      this.renderChapterMap();
      this.showScreen('screen-intro');
    } catch (e) {
      document.getElementById('loading').style.display = 'none';
      this.showScreen('screen-intro');
    }
  },

  showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  },
};

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

Prereq.init();
</script>
</body>
</html>
