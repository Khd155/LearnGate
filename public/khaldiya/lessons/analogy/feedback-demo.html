<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التناظر اللفظي — محرك التغذية الراجعة الذكية</title>
<style>
  :root {
    --bg: #f6f8fb;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --primary: #3F7CB8;
    --radius: 16px;
    --radius-lg: 22px;
    --shadow: 0 8px 24px -8px rgba(15,23,42,.12), 0 2px 6px rgba(15,23,42,.05);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; overflow-x: hidden; }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg,#2B5F94,#3F7CB8);
    color: #fff; padding: 14px 18px;
  }
  .topbar-back {
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25);
    color: #fff; border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: background .15s;
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  }
  .topbar-back:hover { background: rgba(255,255,255,.24); }
  .topbar-title { font-weight: 800; font-size: 15.5px; }
  .topbar-sub { font-size: 11.5px; opacity: .85; margin-top: 1px; }
  .topbar-flex { flex: 1; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }

  /* Level tabs */
  .level-tabs {
    display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 99px; padding: 5px; margin-bottom: 20px; box-shadow: var(--shadow);
  }
  .level-tab {
    flex: 1; border: none; background: transparent; border-radius: 99px;
    padding: 10px 8px; font-family: inherit; font-size: 13.5px; font-weight: 800;
    color: var(--muted); cursor: pointer; transition: background .18s, color .18s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .level-tab.active[data-level="easy"] { background: rgba(16,185,129,.12); color: #059669; }
  .level-tab.active[data-level="medium"] { background: rgba(245,158,11,.14); color: #92400E; }
  .level-tab.active[data-level="advanced"] { background: rgba(239,68,68,.12); color: #B91C1C; }
  .level-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .level-tab[data-level="easy"] .level-dot { background: #10B981; }
  .level-tab[data-level="medium"] .level-dot { background: #F59E0B; }
  .level-tab[data-level="advanced"] .level-dot { background: #EF4444; }

  /* Progress strip */
  .qprog { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .qprog-label { font-size: 13px; font-weight: 700; color: var(--muted); }
  .qprog-dots { display: flex; gap: 6px; }
  .qprog-dot {
    width: 22px; height: 5px; border-radius: 99px; background: var(--border);
    transition: background .2s;
  }
  .qprog-dot.done { background: var(--primary); }
  .qprog-dot.current { background: var(--primary); opacity: .5; }

  /* Question card */
  .qcard {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 22px 20px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .qcard-num {
    font-size: 11.5px; font-weight: 800; color: var(--primary);
    text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px;
  }
  .qcard-text { font-size: 19px; font-weight: 800; color: var(--text); line-height: 1.6; margin-bottom: 18px; }

  .opt-list { display: flex; flex-direction: column; gap: 10px; }
  .opt-row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 13px 16px; text-align: right; font-family: inherit; font-size: 14.5px;
    color: var(--text); cursor: pointer; transition: border-color .15s, background .15s, transform .12s;
  }
  .opt-row:not(:disabled):hover { border-color: var(--primary); transform: translateY(-1px); }
  .opt-row:disabled { cursor: default; }
  .opt-letter {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13.5px; font-weight: 800; background: #f1f5f9; color: var(--muted);
    transition: background .2s, color .2s;
  }
  .opt-text { flex: 1; }

  .opt-row.correct {
    background: rgba(16,185,129,0.08); border: 1.5px solid #10B981;
    box-shadow: 0 4px 20px rgba(16,185,129,0.15);
  }
  .opt-row.correct .opt-letter { background: #10B981; color: #fff; }
  .opt-row.wrong {
    background: rgba(239,68,68,0.06); border: 1.5px solid #EF4444;
    box-shadow: 0 4px 20px rgba(239,68,68,0.12);
  }
  .opt-row.wrong .opt-letter { background: #EF4444; color: #fff; }

  /* Feedback cards */
  @keyframes slideUpFade {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .feedback-card, .hint-card { animation: none !important; }
  }

  .feedback-card {
    margin-top: 16px; animation: slideUpFade .3s ease;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .fb-row { font-size: 13.5px; line-height: 1.75; }
  .fb-label { font-size: 11.5px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: .02em; margin-bottom: 3px; }
  .fb-value { color: var(--text); }

  .golden-rule {
    background: rgba(245,158,11,0.08); border-inline-start: 4px solid #F59E0B;
    border-radius: 0 10px 10px 0; padding: 12px 14px; color: #92400E; font-size: 13.5px;
    font-weight: 700; line-height: 1.7; display: flex; gap: 10px; align-items: flex-start;
  }
  .golden-rule .gr-icon { flex-shrink: 0; font-size: 16px; }

  .hint-card {
    margin-top: 16px; animation: slideUpFade .3s ease;
    background: rgba(99,102,241,0.08); border: 1.5px solid #6366F1; border-radius: var(--radius);
    padding: 16px 18px; position: relative;
  }
  .hint-badge {
    position: absolute; top: -10px; inset-inline-start: 16px;
    background: linear-gradient(135deg,#F59E0B,#D97706); color: #fff;
    font-size: 10.5px; font-weight: 800; padding: 3px 10px; border-radius: 99px;
    box-shadow: 0 3px 8px rgba(217,119,6,.35);
  }
  .hint-head { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; color: #4338CA; margin-bottom: 6px; }
  .hint-text { font-size: 13.5px; line-height: 1.75; color: #3730A3; }
  .retry-btn {
    margin-top: 12px; background: #6366F1; color: #fff; border: none; border-radius: 10px;
    padding: 10px 18px; font-family: inherit; font-size: 13.5px; font-weight: 800;
    cursor: pointer; transition: transform .15s, box-shadow .15s;
  }
  .retry-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px -6px rgba(99,102,241,.5); }

  .attempt-chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700;
    color: var(--muted); background: #f1f5f9; border-radius: 99px; padding: 3px 10px; margin-bottom: 10px;
  }

  .nav-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn {
    flex: 1; border: none; border-radius: 12px; padding: 13px 18px; font-family: inherit;
    font-size: 14.5px; font-weight: 800; cursor: pointer; transition: transform .15s, box-shadow .15s, opacity .15s;
  }
  .btn-primary { background: linear-gradient(135deg,#3F7CB8,#4FA877); color: #fff; box-shadow: 0 10px 22px -10px rgba(11,74,138,.5); }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

  .done-banner {
    text-align: center; padding: 40px 20px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow);
  }
  .done-banner .icon { font-size: 40px; margin-bottom: 10px; }
  .done-banner h3 { margin: 0 0 6px; font-size: 18px; font-weight: 800; }
  .done-banner p { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }

  @media (max-width: 480px) {
    .qcard-text { font-size: 17px; }
    .wrap { padding: 16px 12px 50px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="topbar-back" href="/lessons/analogy/">→ رجوع</a>
  <div class="topbar-flex">
    <div class="topbar-title">🔗 مهارة التناظر اللفظي</div>
    <div class="topbar-sub">محرك التغذية الراجعة الذكية</div>
  </div>
</div>

<div class="wrap">
  <div class="level-tabs" id="level-tabs"></div>
  <div class="qprog" id="qprog"></div>
  <div id="question-area"></div>
</div>

<script>
(function () {
  'use strict';

  var LETTERS = ['أ', 'ب', 'ج', 'د'];

  var DATA = {
    easy: [
      {
        text: 'غصن : شجرة',
        opts: ['زعانف : سمكة', 'غمد : سيف', 'صقر : مخلب', 'سيارة : محرك'],

        opts: ['ميزان : وزن', 'بوصلة : اتجاه', 'قفل : باب', 'قلم : كتابة'],

      {
        text: 'شبكة : صيد',
        opts: ['قلم : كتابة', 'بوصلة : اتجاه', 'مقود : قيادة', 'منظار : رؤية'],
        ans: 0,
        relation: 'أداة ووظيفة محددة.',
        explain: 'الشبكة أداة الصيد المباشرة، والقلم أداة الكتابة المباشرة.',
        excluded: 'بقية الخيارات أدوات لكن وظيفتها أعم أو غير مطابقة تماماً لنمط "أداة ⬅️ فعلها الحصري".',
        golden: 'اختبر: هل الأداة مخصصة حصراً لهذا الفعل؟'
      },
      {
        text: 'إهمال : إخفاق',
        opts: ['عين : رؤية', 'اجتهاد : نجاح', 'عرين : أسد', 'غصن : شجرة'],
        ans: 1,
        relation: 'سبب ونتيجة متماثلة.',
        explain: 'الإهمال يسبب الإخفاق والاجتهاد يسبب النجاح بنفس التماثل المنطقي.',
        excluded: 'بقية الخيارات ليست علاقة سبب-نتيجة سلوكية.',
        golden: 'قارن اتجاه العلاقة الأصلية بدقة قبل المطابقة.'
      },
      {
        text: 'عرين : أسد',
        opts: ['صقر : مخلب', 'غمد : سيف', 'نخلة : بستان', 'جحر : ضب'],
        ans: 3,
        relation: 'المسكن الطبيعي وصاحبه من الكائنات.',
        explain: 'العرين مأوى ومسكن الأسد، والجحر مأوى ومسكن الضب.',
        excluded: 'بقية الخيارات ليست علاقة "مسكن ⬅️ ساكن".',
        golden: 'اسأل: هل الأول هو بيت/مأوى طبيعي للثاني؟'
      },
      {
        text: 'صهيل : حصان',
        opts: ['عش : طائر', 'زئير : أسد', 'جحر : ضب', 'خف : جمل'],

        relation: 'الصوت وصاحبه من الحيوانات.',
        explain: 'الصهيل صوت الحصان والزئير صوت الأسد.',

    ],
    advanced: [
      {

        ans: 1,
        relation: 'تدرج في الشدة لنفس الظاهرة.',
        hint: 'انتبه: الهمس والصراخ كلاهما صوت ولكن أحدهما أشد من الآخر؛ ابحث عن علاقة تدرج وشدة وليست تضاداً.',
        explain: 'الهمس صوت منخفض والصراخ صوت مرتفع جداً، يقابله الدفء (حرارة منخفضة) والحرارة الشديدة (تدرج في الشدة).'
      },
      {
        text: 'غشّ : ثقة',
        opts: ['كذب : صداقة', 'صدق : أمانة', 'خوف : جبن', 'عمل : راتب'],
        ans: 0,
        relation: 'الأول يسلب ويهدم الثاني تماماً.',
        hint: 'اسأل نفسك: ماذا يفعل الغش بالثقة؟ ابحث عن خيار فيه الفعل الأول يهدم أو يلغي الثاني تماماً.',

      {

        ans: 0,
        relation: 'الظاهرة الفيزيائية وأداة قياسها الدقيقة.',

      {
        text: 'خلية : كائن حي',
        opts: ['ذرة : عنصر', 'شجرة : غابة', 'عضو : جسم', 'صفحة : كتاب'],
        ans: 0,
        relation: 'أصغر وحدة بناء وظيفية أساسية.',
        hint: 'الخلية هي وحدة البناء الأصغر والأساسية للكائن الحي؛ ابحث عن وحدة البناء المجهرية الأساسية للمادة.',
        explain: 'الخلية هي الوحدة الأساسية لبناء الكائن الحي، والذرة هي الوحدة الأساسية لبناء العنصر.'
      }
    ]
  };

  var LEVEL_META = {
    easy: { label: 'سهل', icon: '🟢' },
    medium: { label: 'متوسط', icon: '🟡' },
    advanced: { label: 'متقدم', icon: '🔴' }
  };

  // ── In-memory state only — no network, no persistence, instant transitions.
  var state = {
    level: 'easy',
    index: 0,
    // per level, per question index: { answered:bool, selected:int|null, attempts:int, revealed:bool }
    progress: { easy: [], medium: [], advanced: [] }
  };

  ['easy', 'medium', 'advanced'].forEach(function (lvl) {
    state.progress[lvl] = DATA[lvl].map(function () {
      return { answered: false, selected: null, attempts: 0, revealed: false };
    });
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderTabs() {
    var el = document.getElementById('level-tabs');
    el.innerHTML = Object.keys(LEVEL_META).map(function (lvl) {
      var active = lvl === state.level ? ' active' : '';
      return '<button type="button" class="level-tab' + active + '" data-level="' + lvl + '" onclick="App.goLevel(\'' + lvl + '\')">' +
        '<span class="level-dot"></span>' + LEVEL_META[lvl].icon + ' ' + LEVEL_META[lvl].label +
        '</button>';
    }).join('');
  }

  function renderProgress() {
    var el = document.getElementById('qprog');
    var total = DATA[state.level].length;
    var doneCount = state.progress[state.level].filter(function (p) { return p.answered; }).length;
    var dots = state.progress[state.level].map(function (p, i) {
      var cls = i === state.index ? 'current' : (p.answered ? 'done' : '');
      return '<span class="qprog-dot ' + cls + '"></span>';
    }).join('');
    el.innerHTML =
      '<span class="qprog-label">سؤال ' + (state.index + 1) + ' من ' + total + ' — ' + doneCount + ' مكتملة</span>' +
      '<span class="qprog-dots">' + dots + '</span>';
  }

  function optionClass(qIndex, optIndex) {
    var q = DATA[state.level][qIndex];
    var p = state.progress[state.level][qIndex];
    if (!p.answered) return '';
    var isAdvanced = state.level === 'advanced';
    if (isAdvanced && !p.revealed) {
      // Tier 1 (advanced, not yet revealed): only mark the wrong pick red, never reveal correct.
      return optIndex === p.selected ? ' wrong' : '';
    }
    if (optIndex === q.ans) return ' correct';
    if (optIndex === p.selected && p.selected !== q.ans) return ' wrong';
    return '';
  }

  function renderQuestion() {
    var q = DATA[state.level][state.index];
    var p = state.progress[state.level][state.index];
    var isAdvanced = state.level === 'advanced';

    var optsHtml = q.opts.map(function (opt, i) {
      // Once answered, options lock entirely — on advanced's first-wrong
      // state, re-attempting goes through the explicit "إعادة المحاولة" button,
      // not by re-clicking a different option directly.
      var disabled = p.answered;
      return '<button type="button" class="opt-row' + optionClass(state.index, i) + '" ' +
        (disabled ? 'disabled' : '') + ' onclick="App.answer(' + i + ')">' +
        '<span class="opt-letter">' + LETTERS[i] + '</span>' +
        '<span class="opt-text">' + escapeHtml(opt) + '</span>' +
        '</button>';
    }).join('');

    var feedbackHtml = '';
    if (p.answered) {
      if (isAdvanced && !p.revealed) {
        feedbackHtml =
          '<div class="hint-card">' +
            '<span class="hint-badge">تلميح ذكي</span>' +
            '<div class="hint-head">💡 بطاقة التلميح الذكي</div>' +
            '<div class="hint-text">' + escapeHtml(q.hint) + '</div>' +
            '<button type="button" class="retry-btn" onclick="App.retry()">إعادة المحاولة 🔄</button>' +
          '</div>';
      } else {
        var attemptNote = p.attempts > 1
          ? '<span class="attempt-chip">المحاولة ' + p.attempts + '</span>'
          : '';
        var relationRow = q.relation
          ? '<div class="fb-row"><div class="fb-label">نوع العلاقة</div><div class="fb-value">' + escapeHtml(q.relation) + '</div></div>'
          : '';
        var explainRow = '<div class="fb-row"><div class="fb-label">الشرح والتفسير</div><div class="fb-value">' + escapeHtml(q.explain) + '</div></div>';
        var excludedRow = q.excluded
          ? '<div class="fb-row"><div class="fb-label">سبب استبعاد الخيارات الأخرى</div><div class="fb-value">' + escapeHtml(q.excluded) + '</div></div>'
          : '';
        var goldenRow = q.golden
          ? '<div class="golden-rule"><span class="gr-icon">📏</span><span>' + escapeHtml(q.golden) + '</span></div>'
          : '';
        feedbackHtml =
          '<div class="feedback-card">' +
            attemptNote +
            relationRow + explainRow + excludedRow + goldenRow +
          '</div>';
      }
    }

    var isLast = state.index === DATA[state.level].length - 1;
    var navHtml =
      '<div class="nav-actions">' +
        '<button type="button" class="btn btn-outline" ' + (state.index === 0 ? 'disabled' : '') + ' onclick="App.prevQ()">← السابق</button>' +
        '<button type="button" class="btn btn-primary" ' + (!p.answered || (isAdvanced && !p.revealed) ? 'disabled' : '') + ' onclick="App.nextQ()">' +
          (isLast ? 'إنهاء المستوى' : 'التالي →') +
        '</button>' +
      '</div>';

    document.getElementById('question-area').innerHTML =
      '<div class="qcard">' +
        '<div class="qcard-num">سؤال ' + (state.index + 1) + '</div>' +
        '<div class="qcard-text">' + escapeHtml(q.text) + '</div>' +
        '<div class="opt-list">' + optsHtml + '</div>' +
        feedbackHtml +
      '</div>' +
      navHtml;
  }

  function renderDone() {
    document.getElementById('question-area').innerHTML =
      '<div class="done-banner">' +
        '<div class="icon">🎉</div>' +
        '<h3>أنهيت مستوى ' + LEVEL_META[state.level].label + '</h3>' +
        '<p>راجع أي سؤال عبر النقاط أعلاه، أو انتقل لمستوى آخر.</p>' +
      '</div>';
  }

  function render() {
    renderTabs();
    renderProgress();
    if (state.index >= DATA[state.level].length) {
      renderDone();
    } else {
      renderQuestion();
    }
    // Smooth, immediate scroll reset — no lag, no layout thrash.
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.App = {
    goLevel: function (lvl) {
      if (lvl === state.level) return;
      state.level = lvl;
      state.index = 0;
      render();
    },
    answer: function (optIndex) {
      var q = DATA[state.level][state.index];
      var p = state.progress[state.level][state.index];
      if (p.answered && !(state.level === 'advanced' && !p.revealed)) return;

      p.attempts += 1;
      p.selected = optIndex;
      p.answered = true;

      if (state.level === 'advanced') {
        if (optIndex === q.ans) {
          p.revealed = true; // correct on any attempt: show full explanation card
        } else if (p.attempts >= 2) {
          p.revealed = true; // wrong twice: reveal full explanation
        } else {
          p.revealed = false; // first wrong: smart hint only, no reveal
        }
      }
      render();
    },
    retry: function () {
      var p = state.progress[state.level][state.index];
      p.answered = false; // re-enable options for another attempt; attempts counter persists
      render();
    },
    nextQ: function () {
      if (state.index < DATA[state.level].length) state.index += 1;
      render();
    },
    prevQ: function () {
      if (state.index > 0) state.index -= 1;
      render();
    }
  };

  render();
})();
</script>
</body>
</html>
