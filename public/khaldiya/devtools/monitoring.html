<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Dev Monitoring</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Tahoma, sans-serif; background:#0f1115; color:#e6e6e6; margin:0; padding:20px; }
  h1 { font-size:18px; margin:0 0 16px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .card { background:#1a1d24; border:1px solid #2a2e38; border-radius:8px; padding:12px 16px; min-width:150px; }
  .card .label { font-size:12px; color:#9aa0ab; margin-bottom:4px; }
  .card .value { font-size:22px; font-weight:700; }
  .value.err { color:#ff6b6b; }
  table { width:100%; border-collapse:collapse; font-size:12px; background:#1a1d24; border:1px solid #2a2e38; border-radius:8px; overflow:hidden; }
  th, td { padding:6px 10px; text-align:right; border-bottom:1px solid #2a2e38; }
  th { color:#9aa0ab; font-weight:600; }
  tr.error td { color:#ff6b6b; }
  tr.exception td { color:#ffb347; }
  #gate { max-width:360px; margin:80px auto; text-align:center; }
  #gate input { width:100%; padding:8px; margin:8px 0; background:#1a1d24; border:1px solid #2a2e38; color:#fff; border-radius:6px; }
  #gate button { padding:8px 16px; background:#4f7cff; border:none; border-radius:6px; color:#fff; cursor:pointer; }
  #app { display:none; }
  .muted { color:#9aa0ab; font-size:12px; }
</style>
</head>
<body>
  <div id="gate">
    <h1>Dev Monitoring</h1>
    <p class="muted">أدخل مفتاح DEV_KEY للدخول</p>
    <input id="keyInput" type="password" placeholder="X-Dev-Key">
    <button onclick="enter()">دخول</button>
    <p id="gateErr" class="muted" style="color:#ff6b6b;"></p>
  </div>

  <div id="app">
    <h1>📊 Dev Monitoring</h1>
    <div class="row" id="cards"></div>

    <div class="card" style="margin-bottom:16px;">
      <div class="label">🔌 اختبار WebSocket</div>
      <div id="wsStatus" style="margin:6px 0;">غير متصل</div>
      <button onclick="sendWsTest()" style="padding:6px 14px; background:#4f7cff; border:none; border-radius:6px; color:#fff; cursor:pointer;">إرسال حدث تجريبي</button>
      <ul id="wsLog" style="margin:10px 0 0; padding:0; list-style:none; font-size:12px; max-height:120px; overflow:auto;"></ul>
    </div>

    <p class="muted">آخر السجلات (يتحدّث كل 5 ثوانٍ)</p>
    <table>
      <thead><tr><th>الوقت</th><th>النوع</th><th>method</th><th>path</th><th>status</th><th>ms</th><th>IP</th></tr></thead>
      <tbody id="logsBody"></tbody>
    </table>
  </div>

<script>
  let KEY = localStorage.getItem('dev_monitor_key') || '';

  function enter() {
    KEY = document.getElementById('keyInput').value.trim();
    if (!KEY) return;
    localStorage.setItem('dev_monitor_key', KEY);
    boot();
    connectWs();
  }

  async function boot() {
    const res = await fetch('/api/dev/monitoring/stats', { headers: { 'X-Dev-Key': KEY } });
    if (!res.ok) {
      document.getElementById('gateErr').textContent = 'مفتاح غير صحيح';
      return;
    }
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    refresh();
    setInterval(refresh, 5000);
  }

  function fmtTime(iso) {
    return new Date(iso).toLocaleTimeString('ar-SA', { hour12: false });
  }

  async function refresh() {
    try {
      const [statsRes, logsRes] = await Promise.all([
        fetch('/api/dev/monitoring/stats', { headers: { 'X-Dev-Key': KEY } }),
        fetch('/api/dev/monitoring/logs?limit=80', { headers: { 'X-Dev-Key': KEY } }),
      ]);
      const stats = await statsRes.json();
      const { logs } = await logsRes.json();

      document.getElementById('cards').innerHTML = `
        <div class="card"><div class="label">Requests / دقيقة</div><div class="value">${stats.requestsPerMinute}</div></div>
        <div class="card"><div class="label">نسبة الأخطاء (5 دقائق)</div><div class="value ${stats.errorRate5m > 5 ? 'err' : ''}">${stats.errorRate5m}%</div></div>
        <div class="card"><div class="label">متوسط زمن الاستجابة</div><div class="value">${stats.avgResponseMs5m}ms</div></div>
        <div class="card"><div class="label">طلبات (5 دقائق)</div><div class="value">${stats.requests5m}</div></div>
        <div class="card"><div class="label">أخطاء (5 دقائق)</div><div class="value ${stats.errors5m ? 'err' : ''}">${stats.errors5m}</div></div>
        <div class="card"><div class="label">Uptime</div><div class="value">${Math.floor(stats.uptimeSeconds / 60)}m</div></div>
      `;

      document.getElementById('logsBody').innerHTML = logs.map(l => `
        <tr class="${l.type}">
          <td>${fmtTime(l.time)}</td>
          <td>${l.type}</td>
          <td>${l.method || '-'}</td>
          <td>${l.path || l.message || '-'}</td>
          <td>${l.status ?? '-'}</td>
          <td>${l.durationMs ?? '-'}</td>
          <td>${l.ip ?? '-'}</td>
        </tr>
      `).join('');
    } catch (e) {
      console.error(e);
    }
  }

  // ── WebSocket experiment ──────────────────────────────────────────────
  let ws = null;
  let wsReconnectDelay = 1000;

  function wsLog(text) {
    const li = document.createElement('li');
    li.textContent = `${new Date().toLocaleTimeString('ar-SA', { hour12: false })} — ${text}`;
    const box = document.getElementById('wsLog');
    box.prepend(li);
    while (box.children.length > 20) box.removeChild(box.lastChild);
  }

  function connectWs() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws?devkey=${encodeURIComponent(KEY)}`);

    ws.onopen = () => {
      document.getElementById('wsStatus').textContent = '🟢 متصل';
      wsReconnectDelay = 1000;
      wsLog('تم الاتصال');
    };
    ws.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        wsLog(`استلام: ${data.type} — ${data.message || data.role || ''}`);
      } catch { wsLog('استلام: ' + e.data); }
    };
    ws.onclose = () => {
      document.getElementById('wsStatus').textContent = '🔴 غير متصل — إعادة محاولة...';
      wsLog('انقطع الاتصال، إعادة محاولة خلال ' + (wsReconnectDelay / 1000) + 'ث');
      setTimeout(connectWs, wsReconnectDelay);
      wsReconnectDelay = Math.min(wsReconnectDelay * 2, 15000);
    };
    ws.onerror = () => { ws.close(); };
  }

  async function sendWsTest() {
    const res = await fetch('/api/dev/monitoring/ws-test', {
      method: 'POST',
      headers: { 'X-Dev-Key': KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'مرحبا من لوحة المراقبة 👋' }),
    });
    const data = await res.json();
    wsLog(`تم الإرسال إلى ${data.delivered} عميل متصل`);
  }

  if (KEY) { boot(); connectWs(); }
</script>
</body>
</html>
