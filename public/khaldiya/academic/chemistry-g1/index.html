<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@600;700;800;900&display=swap"></noscript>
<style>
/* ── Tokens ─────────────────────────────────────────────────────────────
   Light = the platform default (ministry blue→green identity, biology page).
   Dark  = direction A "Slate Glass". Colours that need an alpha are stored as
   space-separated RGB triplets so both themes share one set of rules. */
:root{
  color-scheme:light;
  --bg:#F1F5F9; --surface:#FFFFFF; --surface2:#F8FAFC; --surface3:#EEF3F8;
  --border:#E2E8F0; --border-strong:#CBD5E1;
  --text:#0F172A; --muted:#475569; --dim:#566378;
  --p:38 94 149; --g:12 98 66; --a:146 64 14; --d:197 48 48; --v:109 40 217; --mute:71 85 105;
  --l-foundational:3 105 161; --l-descriptive:109 40 217; --l-structural:29 78 216; --l-reactive:154 68 6; --l-quantitative:4 120 87;
  --card-bg:var(--surface);
  --shadow:0 8px 24px -10px rgba(15,23,42,.14),0 2px 6px rgba(15,23,42,.05);
  --shadow-lg:0 24px 60px -24px rgba(15,23,42,.28);
  --page-bg:#F1F5F9;
  --cta:linear-gradient(135deg,#2B6AA6 0%,#2A7F88 55%,#2F8060 100%);
  --hero:linear-gradient(rgba(6,30,58,.36),rgba(6,30,58,.36)),linear-gradient(135deg,#3F7CB8 0%,#4A96A0 55%,#4FA877 100%);
  --topbar:linear-gradient(rgba(6,30,58,.36),rgba(6,30,58,.36)),linear-gradient(135deg,#3F7CB8 0%,#4A96A0 55%,#4FA877 100%);
  --topbar-shadow:0 6px 24px -10px rgba(7,54,105,.55);
  --tabs-bg:var(--surface);
  --track:#E2E8F0;
  --r:18px; --r-lg:22px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1220; --surface:#121C2E; --surface2:#182539; --surface3:#1F2F48;
  --border:rgba(148,170,200,.14); --border-strong:rgba(148,170,200,.30);
  --text:#EAF0F8; --muted:#A9B8CC; --dim:#8B9CB4;
  --p:111 168 218; --g:111 203 152; --a:240 169 78; --d:242 124 124; --v:176 154 240; --mute:169 184 204;
  --l-foundational:140 210 246; --l-descriptive:196 172 248; --l-structural:140 178 250; --l-reactive:240 179 90; --l-quantitative:98 214 164;
  --card-bg:linear-gradient(180deg,#152136,#121C2E);
  --shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 34px -18px rgba(0,0,0,.65);
  --shadow-lg:0 24px 60px -28px rgba(0,0,0,.8);
  --page-bg:radial-gradient(900px 520px at 88% -12%,rgba(63,124,184,.26),transparent 62%),radial-gradient(760px 480px at -4% 108%,rgba(79,168,119,.14),transparent 60%),#0B1220;
  --hero:linear-gradient(135deg,#1C4470 0%,#1C5560 55%,#1D5A44 100%);
  --topbar:linear-gradient(180deg,#182539,#121C2E);
  --topbar-shadow:0 10px 30px -18px rgba(0,0,0,.8);
  --tabs-bg:#0D1526;
  --track:rgba(148,170,200,.16);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;min-height:100vh;}
body{font-family:'Tajawal','Cairo',sans-serif;background:var(--page-bg);background-attachment:fixed;color:var(--text);direction:rtl;font-size:16px;font-weight:500;line-height:1.6;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Cairo','Tajawal',sans-serif;font-weight:800;margin:0;}
button{font-family:inherit;color:inherit;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.ic{width:1.2em;height:1.2em;flex-shrink:0;}
:focus-visible{outline:3px solid rgb(var(--p) / .65);outline-offset:2px;border-radius:8px;}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}

/* ── Sticky chrome: topbar + tabs ───────────────────────────────────── */
.chrome{position:sticky;top:0;z-index:100;}
.topbar{background:var(--topbar);color:#fff;min-height:76px;padding:10px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:var(--topbar-shadow);position:relative;}
:root[data-theme="dark"] .topbar{color:var(--text);border-bottom:1px solid var(--border);}
:root[data-theme="dark"] .topbar::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,#3F7CB8 25%,#4A96A0 55%,#4FA877 80%,transparent);opacity:.7;}
.tb-start{display:flex;align-items:center;gap:12px;min-width:0;}
.topbar-logo{height:34px;opacity:.95;flex-shrink:0;}
.topbar-title{font-family:'Cairo',sans-serif;font-weight:800;font-size:17.5px;letter-spacing:-.01em;line-height:1.3;}
.topbar-sub{font-size:12.5px;font-weight:500;}
.tb-progress{width:280px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.tbp-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:700;}
.tbp-row b{font-family:'Cairo',sans-serif;font-size:15px;font-weight:800;}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;}
:root[data-theme="dark"] .bar{background:var(--track);}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:#fff;transition:width .6s ease;}
:root[data-theme="dark"] .bar>i{background:linear-gradient(90deg,rgb(var(--p)),rgb(var(--g)));box-shadow:0 0 14px rgb(var(--g) / .55);}
.tbp-sub{font-size:12px;font-weight:500;}
.tb-end{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.user-chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:99px;background:rgba(6,30,58,.28);border:1.5px solid rgba(255,255,255,.42);font-size:13px;font-weight:700;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
:root[data-theme="dark"] .user-chip{background:rgba(255,255,255,.06);border-color:var(--border);}
.user-chip .dot{width:8px;height:8px;border-radius:50%;background:#a3e635;flex-shrink:0;box-shadow:0 0 10px #a3e635;}
.tb-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;min-width:44px;padding:0 16px;border-radius:99px;background:rgba(6,30,58,.28);border:1.5px solid rgba(255,255,255,.42);color:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:background .18s;white-space:nowrap;}
.tb-btn:hover{background:rgba(6,30,58,.42);}
:root[data-theme="dark"] .tb-btn{background:rgba(255,255,255,.06);border-color:var(--border-strong);}
:root[data-theme="dark"] .tb-btn:hover{background:rgba(255,255,255,.12);}
.tb-btn.icon{padding:0;width:44px;}
.theme-btn .i-sun{display:none;} :root[data-theme="dark"] .theme-btn .i-sun{display:block;} :root[data-theme="dark"] .theme-btn .i-moon{display:none;}

.tabs{display:flex;gap:4px;padding:8px 28px 0;background:var(--tabs-bg);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;box-shadow:0 8px 20px -16px rgba(15,23,42,.25);}
.tabs::-webkit-scrollbar{display:none;}
.tab{position:relative;display:inline-flex;align-items:center;gap:9px;height:56px;padding:0 20px;border:0;background:transparent;border-radius:14px 14px 0 0;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:color .15s,background .15s;}
.tab .ic{color:var(--dim);}
.tab:hover{color:var(--text);}
.tab[aria-selected="true"]{color:var(--text);font-weight:800;background:linear-gradient(180deg,transparent,rgb(var(--p) / .12));}
.tab[aria-selected="true"] .ic{color:rgb(var(--p));}
.tab[aria-selected="true"]::after{content:"";position:absolute;inset-inline:14px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,#3F7CB8,#4A96A0,#4FA877);box-shadow:0 0 14px rgba(74,150,160,.6);}
.tab[aria-disabled="true"]{color:var(--dim);}
.tab-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:800;color:rgb(var(--a));background:rgb(var(--a) / .13);border:1px solid rgb(var(--a) / .36);}
.tab-badge.done{color:rgb(var(--g));background:rgb(var(--g) / .13);border-color:rgb(var(--g) / .36);}
.tab .lock-ic{color:rgb(var(--a));}
.tab.just-unlocked .lock-ic{animation:pop .7s ease;}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.5) rotate(-12deg);}100%{transform:scale(1);}}

/* ── Layout ─────────────────────────────────────────────────────────── */
.wrap{max-width:1100px;margin:0 auto;padding:26px 20px 72px;}
.pane[hidden]{display:none;}
.pane{animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:26px 28px;margin-bottom:20px;}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.card-h h3{font-size:18px;}
.card-h .dot{width:8px;height:8px;border-radius:50%;background:rgb(var(--p));box-shadow:0 0 12px rgb(var(--p) / .7);}
.card-h .end{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap;color:rgb(var(--c,var(--p)));background:rgb(var(--c,var(--p)) / .13);border:1px solid rgb(var(--c,var(--p)) / .36);}
.pill.l-foundational{--c:var(--l-foundational);} .pill.l-descriptive{--c:var(--l-descriptive);} .pill.l-structural{--c:var(--l-structural);}
.pill.l-reactive{--c:var(--l-reactive);} .pill.l-quantitative{--c:var(--l-quantitative);}
.pill.ok{--c:var(--g);} .pill.warn{--c:var(--a);} .pill.bad{--c:var(--d);} .pill.mute{--c:var(--mute);font-weight:700;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:calc(var(--r) - 4px);border:1px solid rgba(255,255,255,.16);background:var(--cta);color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 16px 34px -16px rgba(43,95,148,.85),inset 0 1px 0 rgba(255,255,255,.22);transition:filter .15s,transform .15s;text-decoration:none;}
.btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.block{width:100%;}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border-strong);box-shadow:none;}
.btn.ghost:hover:not(:disabled){background:var(--surface3);}
.btn.sm{min-height:44px;padding:0 18px;font-size:14px;}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;margin-bottom:18px;border-radius:99px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;}
.back:hover{background:var(--surface3);}

/* ── Overview ───────────────────────────────────────────────────────── */
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:calc(var(--r-lg) + 4px);padding:32px 34px;border:1px solid rgba(255,255,255,.14);box-shadow:var(--shadow-lg);margin-bottom:20px;}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 130%,rgba(255,255,255,.16),transparent 70%);pointer-events:none;}
.hero-mol{position:absolute;inset-inline-end:34px;top:50%;transform:translateY(-50%);opacity:.9;pointer-events:none;}
.hero-top{position:relative;display:flex;align-items:center;gap:16px;margin-bottom:12px;}
.hero-icon{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);display:grid;place-items:center;font-size:28px;flex-shrink:0;}
.hero h2{font-size:26px;color:#fff;}
.hero p{position:relative;margin:0;max-width:620px;font-size:16px;line-height:1.95;color:rgba(255,255,255,.95);}
.next-step{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 22px;margin-bottom:20px;border-radius:var(--r);background:linear-gradient(135deg,rgb(var(--a) / .12),var(--surface));border:1px solid rgb(var(--a) / .34);box-shadow:var(--shadow);}
.next-step.ok{background:linear-gradient(135deg,rgb(var(--g) / .11),var(--surface));border-color:rgb(var(--g) / .34);}
.next-step .ns-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgb(var(--a) / .15);color:rgb(var(--a));font-size:22px;flex-shrink:0;}
.next-step.ok .ns-ic{background:rgb(var(--g) / .15);color:rgb(var(--g));}
.next-step .ns-txt{flex:1;min-width:220px;}
.next-step .ns-t{font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;}
.next-step .ns-d{font-size:14px;color:var(--muted);}
.feat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;}
.feat{position:relative;display:flex;flex-direction:column;gap:14px;padding:26px;text-align:start;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);cursor:pointer;transition:transform .2s,border-color .2s;color:var(--text);}
.feat:hover:not(.off){transform:translateY(-3px);border-color:rgb(var(--p) / .45);}
.feat.off{opacity:.75;cursor:not-allowed;}
.feat .f-tile{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:25px;color:rgb(var(--c));background:rgb(var(--c) / .14);border:1px solid rgb(var(--c) / .34);}
.feat .f-badge{position:absolute;top:20px;inset-inline-end:20px;}
.feat .f-t{font-family:'Cairo',sans-serif;font-weight:800;font-size:19px;}
.feat .f-d{font-size:14.5px;line-height:1.85;color:var(--muted);}
.feat .f-go{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:800;color:rgb(var(--p));}
.feat.off .f-go{color:var(--dim);font-weight:700;}

/* ── Concept map ────────────────────────────────────────────────────── */
.legend{display:flex;gap:8px;flex-wrap:wrap;}
.rm{position:relative;padding-inline-start:var(--rail,120px);}
.rm-svg{position:absolute;inset-inline-start:0;top:0;pointer-events:none;overflow:visible;}
.rm-list{display:flex;flex-direction:column;gap:18px;}
.ch{display:flex;flex-direction:column;gap:9px;width:100%;text-align:start;padding:16px 22px;border-radius:calc(var(--r) - 2px);background:var(--card-bg);border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;transition:transform .18s,border-color .18s;color:var(--text);}
.ch:hover{transform:translateY(-2px);border-color:var(--border-strong);}
.ch.mastered{background:linear-gradient(135deg,rgb(var(--g) / .11),var(--surface) 72%);border-color:rgb(var(--g) / .34);}
.ch.needs_review{background:linear-gradient(135deg,rgb(var(--a) / .11),var(--surface) 72%);border-color:rgb(var(--a) / .36);}
.ch.multi{background:linear-gradient(135deg,rgb(var(--l-reactive) / .11),var(--surface) 72%);border-color:rgb(var(--l-reactive) / .6);box-shadow:var(--shadow),0 0 0 1px rgb(var(--l-reactive) / .16),0 20px 44px -24px rgb(var(--l-reactive) / .55);}
.ch-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ch-num{font-family:'Cairo',sans-serif;font-size:13px;font-weight:800;color:var(--muted);}
.ch-status{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--dim);}
.ch.mastered .ch-status{color:rgb(var(--g));} .ch.needs_review .ch-status{color:rgb(var(--a));}
.ch-title{font-family:'Cairo',sans-serif;font-size:20px;font-weight:800;}
.ch-bot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);}
.ch-bot .grow{margin-inline-start:auto;}
.ch-bot .feeds{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:rgb(var(--l-reactive));}
.dep-chip{padding:1px 10px;border-radius:99px;font-size:12.5px;font-weight:800;color:rgb(var(--c));background:rgb(var(--c) / .13);border:1px solid rgb(var(--c) / .34);}
/* rail svg (theme-aware through CSS, not baked-in colours) */
.rl{fill:none;stroke-width:3;stroke-linecap:round;}
.rl.dim{stroke:rgb(var(--dim-rgb,120 135 160) / .45);stroke-dasharray:2 7;}
.rl.done{stroke:rgb(var(--g));opacity:.85;}
.rl.hi{stroke:rgb(var(--l-reactive));stroke-width:3.4;}
.arc{fill:none;stroke:rgb(var(--l-reactive));stroke-width:2.6;stroke-dasharray:7 6;stroke-linecap:round;}
.arc-txt{fill:rgb(var(--l-reactive));font-size:12.5px;font-weight:700;font-family:'Tajawal',sans-serif;}
.arw{fill:rgb(var(--l-reactive));}
.nd{stroke-width:2.4;}
.nd.mastered{fill:rgb(var(--g) / .18);stroke:rgb(var(--g));}
.nd.needs_review{fill:var(--surface);stroke:rgb(var(--a));}
.nd.default{fill:var(--surface);stroke:rgb(var(--c) / .75);}
.nd.multi{fill:var(--surface);stroke:rgb(var(--l-reactive));}
.nd-core{fill:rgb(var(--a));} .nd-core.multi{fill:rgb(var(--l-reactive));}
.nd-halo{fill:rgb(var(--a) / .14);} .nd-halo.multi{fill:rgb(var(--l-reactive) / .16);}
.nd-check{fill:none;stroke:rgb(var(--g));stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.prereq-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
.prq{display:flex;flex-direction:column;gap:12px;padding:18px 22px;border-radius:calc(var(--r) - 4px);background:var(--surface2);border:1px solid var(--border);}
.prq .p-n{font-size:15.5px;font-weight:700;line-height:1.7;}
.prq .p-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.prq .p-u{margin-inline-start:auto;font-size:13.5px;color:var(--muted);}
.prq .p-u b{color:rgb(var(--g));font-weight:800;}

/* ── Diagnostic engine ──────────────────────────────────────────────── */
.eng-top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
.eng-top .cnt{font-size:14px;font-weight:800;color:var(--muted);white-space:nowrap;}
.segs{flex:1;min-width:120px;display:flex;gap:8px;}
.segs i{flex:1;height:6px;border-radius:99px;background:var(--track);}
.segs i.on{background:linear-gradient(90deg,rgb(var(--p)),rgb(var(--g)));box-shadow:0 0 12px rgb(var(--g) / .45);}
.q-prompt{font-family:'Cairo','Tajawal',sans-serif;font-size:23px;font-weight:800;line-height:1.75;margin-bottom:24px;}
.opt-wrap{margin-bottom:14px;}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 18px;text-align:start;border-radius:calc(var(--r) - 4px);border:1.5px solid var(--border-strong);background:var(--surface2);color:var(--text);font-size:16.5px;font-weight:700;cursor:pointer;transition:border-color .15s,background .15s,transform .15s,box-shadow .15s;}
.opt:hover:not(:disabled){border-color:rgb(var(--p));background:rgb(var(--p) / .10);transform:translateY(-1px);}
.opt .ltr{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;font-size:15px;font-weight:800;background:var(--surface3);color:var(--muted);}
.opt .tx{flex:1;}
.opt .st{font-size:24px;}
.opt:disabled{cursor:default;}
.opt.correct{background:rgb(var(--g) / .13);border-color:rgb(var(--g) / .65);box-shadow:0 12px 28px -16px rgb(var(--g) / .7);}
.opt.correct .ltr{background:rgb(var(--g));color:#fff;} .opt.correct .st{color:rgb(var(--g));}

.opt.wrong .ltr{background:rgb(var(--d));color:#fff;} .opt.wrong .st{color:rgb(var(--d));}

.opt.reveal{background:rgb(var(--g) / .06);border-color:rgb(var(--g) / .6);}
.opt.reveal .st{color:rgb(var(--g));} .opt.reveal .ltr{background:rgb(var(--g) / .16);color:rgb(var(--g));}
.fb{display:flex;gap:12px;align-items:flex-start;margin:10px 4px 0;padding:14px 18px;border-radius:14px;font-size:14.5px;line-height:1.9;}
.fb .ic{margin-top:4px;font-size:18px;}
.fb.ok{background:rgb(var(--g) / .10);color:rgb(var(--g));} .fb.bad{background:rgb(var(--d) / .10);color:rgb(var(--d));}
.fb span{color:var(--text);}
.eng-next{margin-top:14px;}
.branch{text-align:center;padding:14px 4px 4px;}
.branch .b-ic{width:72px;height:72px;margin:0 auto 14px;border-radius:24px;display:grid;place-items:center;font-size:36px;color:rgb(var(--c));background:rgb(var(--c) / .14);border:1px solid rgb(var(--c) / .36);}
.branch h3{font-size:22px;margin-bottom:8px;}
.branch .b-d{font-size:15px;color:var(--muted);line-height:1.9;margin:0 auto 18px;max-width:560px;}
.glance{margin:0 auto 14px;max-width:560px;padding:14px 18px;border-radius:14px;background:rgb(var(--p) / .07);border:1px solid rgb(var(--p) / .22);}
.glance-t{font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;}
.glance-d{font-size:14px;color:var(--muted);margin:2px 0 10px;}
.gate-intro{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
.gate-intro .gi-ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:32px;color:rgb(var(--a));background:rgb(var(--a) / .14);border:1px solid rgb(var(--a) / .36);flex-shrink:0;}
.gate-intro .gi-t{flex:1;min-width:240px;}
.gate-intro h3{font-size:21px;margin-bottom:6px;}
.gate-intro p{margin:0;color:var(--muted);font-size:15px;line-height:1.9;}
.steps-mini{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

/* ── Locked / empty states ──────────────────────────────────────────── */
.locked{text-align:center;padding:34px 20px 30px;}
.locked .lk{width:84px;height:84px;margin:0 auto 18px;border-radius:28px;display:grid;place-items:center;font-size:40px;color:rgb(var(--a));background:rgb(var(--a) / .13);border:1px solid rgb(var(--a) / .36);}
.locked h3{font-size:22px;margin-bottom:8px;}
.locked p{margin:0 auto 22px;max-width:520px;color:var(--muted);line-height:1.9;}
.state{padding:56px 20px;text-align:center;color:var(--muted);}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--track);border-top-color:rgb(var(--p));margin:0 auto 14px;animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Chapters list + stepper ────────────────────────────────────────── */
.ch-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
.ch-grid .ch{min-height:150px;}
.stepper{list-style:none;margin:0 0 22px;padding:0;display:flex;gap:0;overflow-x:auto;scrollbar-width:thin;}
.stepper li{flex:1;min-width:118px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;}
.stepper li:not(:last-child)::before{content:"";position:absolute;top:21px;inset-inline-start:calc(50% + 26px);width:calc(100% - 52px);height:3px;border-radius:3px;background:var(--track);}
.stepper li.done:not(:last-child)::before{background:linear-gradient(90deg,rgb(var(--g)),rgb(var(--g)));}
.st-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 6px;background:none;border:0;cursor:pointer;}
.st-btn:disabled{cursor:not-allowed;}
.st-dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--surface2);border:2px solid var(--border-strong);color:var(--dim);position:relative;z-index:1;transition:.2s;}
.stepper li.done .st-dot{background:rgb(var(--g) / .16);border-color:rgb(var(--g));color:rgb(var(--g));}
.stepper li.cur .st-dot{background:var(--cta);border-color:transparent;color:#fff;box-shadow:0 0 0 5px rgb(var(--p) / .2),0 12px 24px -10px rgba(43,95,148,.8);}
.st-lb{font-size:13px;font-weight:700;color:var(--muted);text-align:center;line-height:1.4;}
.stepper li.cur .st-lb{color:var(--text);font-weight:800;}
.step-panel{animation:fade .25s ease;}
.step-nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap;}
.sub-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.chip{display:inline-flex;align-items:center;padding:5px 14px;border-radius:99px;font-size:13.5px;font-weight:700;color:rgb(var(--p));background:rgb(var(--p) / .12);border:1px solid rgb(var(--p) / .3);}
.mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
.mini{padding:16px 18px;border-radius:calc(var(--r) - 4px);background:var(--surface2);border:1px solid var(--border);display:flex;gap:12px;align-items:center;}
.mini .mn{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-family:'Cairo',sans-serif;font-weight:800;background:rgb(var(--p) / .14);color:rgb(var(--p));flex-shrink:0;}
.mini .mt{font-size:15px;font-weight:700;line-height:1.6;}

.term{font-size:14.5px;line-height:1.8;margin-bottom:6px;}

.ev .ev-p{font-size:15px;line-height:1.9;}
.reveal{margin-top:12px;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;background:none;border:0;color:rgb(var(--c));font-size:14px;font-weight:800;cursor:pointer;}
.model{margin-top:6px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:14px;line-height:1.9;color:var(--muted);}
.model[hidden]{display:none;}

/* ── Progress pane ──────────────────────────────────────────────────── */
.prog-top{display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
.ring{--v:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(rgb(var(--g)) calc(var(--v) * 1%),var(--track) 0);display:grid;place-items:center;flex-shrink:0;}
.ring>div{width:94px;height:94px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:'Cairo',sans-serif;font-size:26px;font-weight:800;}

.prog-top h3{font-size:20px;margin-bottom:6px;}
.prog-top p{margin:0;color:var(--muted);line-height:1.9;}
.p-row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--border);flex-wrap:wrap;}
.p-row:first-child{border-top:0;}
.p-row .pr-n{font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;flex:1;min-width:180px;}
.p-row .pr-n small{display:block;font-family:'Tajawal',sans-serif;font-weight:500;font-size:13px;color:var(--muted);}

/* ── Toast ──────────────────────────────────────────────────────────── */
.toast{position:fixed;inset-inline:0;bottom:22px;margin:0 auto;width:max-content;max-width:calc(100vw - 32px);z-index:300;display:flex;align-items:center;gap:12px;padding:13px 18px;border-radius:16px;background:var(--surface);color:var(--text);border:1px solid var(--border-strong);box-shadow:var(--shadow-lg);font-size:14.5px;font-weight:700;opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s;}
.toast.show{opacity:1;transform:none;pointer-events:auto;}
.toast .ic{color:rgb(var(--a));font-size:20px;}
.toast.ok .ic{color:rgb(var(--g));}
.toast button{background:none;border:0;color:var(--dim);cursor:pointer;min-width:44px;min-height:44px;font-size:16px;}

/* ── Responsive ─────────────────────────────────────────────────────── */
@media (max-width:900px){
  .chrome{display:contents;}
  .tabs{position:sticky;top:0;z-index:100;}
  .topbar{flex-wrap:wrap;padding:10px 16px;}

  .toast{bottom:auto;top:72px;}
}

function getStudentSession() {
  try {
    const raw = sessionStorage.getItem('lg_session_student') || localStorage.getItem('lg_xsession_student');
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function apiFetch(path, opts = {}) {
  const sess = getStudentSession();
  return fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(sess?.token ? { Authorization: 'Bearer ' + sess.token } : {}), ...(opts.headers || {}) },
  }).then(async (r) => {
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    return d;
  });
}
const esc = (str) => String(str ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const icon = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

const SUBJECT_ID = 'chemistry-1';
const LAYER_LABELS = { foundational: 'تأسيسي', descriptive: 'وصفي', structural: 'تركيبي', reactive: 'تفاعلي', quantitative: 'كمّي' };
const STATUS = {
  mastered:     { label: 'متقن',          ico: 'check' },
  needs_review: { label: 'تحتاج مراجعة',  ico: 'alert' },
  default:      { label: 'لم يبدأ',       ico: 'target' },
};
const SOURCE_ICON = { 'علوم': 'flask', 'رياضيات': 'sigma' };
const LETTERS = ['أ', 'ب', 'ج', 'د', 'هـ'];
const TABS = ['overview', 'map', 'diag', 'chapters', 'progress'];
const STEPS = [
  { key: 'intro',   label: 'تمهيد الفصل',    ico: 'flag' },
  { key: 'prereq',  label: 'متطلبات قبلية',  ico: 'link' },
  { key: 'diag',    label: 'تشخيص الفصل',    ico: 'target' },
  { key: 'content', label: 'المحتوى',        ico: 'book' },

/* ── Diagnostic engine (used by the subject gate AND the chapter step) ── */
class Engine {
  constructor(key, host, questions, onDone) {
    this.key = key; this.host = host; this.questions = questions; this.onDone = onDone;
    this.index = 0; this.picked = null; this.weak = [];
  }
  render() {
    const q = this.questions[this.index];
    const n = this.questions.length;
    const answered = this.picked !== null;
    const segs = this.questions.map((_, i) => `<i class="${i <= this.index ? 'on' : ''}"></i>`).join('');
    const opts = q.options.map((o, i) => {
      // Feedback belongs to the pressed option ONLY. A wrong pick shows just its own
      // explanation; the right answer is then marked quietly (border + tick, no box).
      const pickedThis = answered && this.picked === i;
      const pickedRight = answered && q.options[this.picked].is_correct;
      const good = pickedThis && o.is_correct;
      const bad = pickedThis && !o.is_correct;
      const reveal = answered && !pickedThis && o.is_correct && !pickedRight;
      const cls = good ? 'correct' : bad ? 'wrong' : reveal ? 'reveal' : '';
      const stIc = reveal ? `<span class="st">${icon('okc')}<span class="sr-only">الإجابة الصحيحة</span></span>` : good ? `<span class="st">${icon('okc')}<span class="sr-only">إجابة صحيحة</span></span>` : bad ? `<span class="st">${icon('xc')}<span class="sr-only">إجابة غير دقيقة</span></span>` : '';
      const fb = (good || bad) && o.feedback
        ? `<div class="fb ${o.is_correct ? 'ok' : 'bad'}">${icon(o.is_correct ? 'check' : 'info')}<span>${esc(o.feedback)}</span></div>` : '';
      return `<div class="opt-wrap"><button type="button" class="opt ${cls}" data-act="answer" data-eng="${this.key}" data-i="${i}" ${answered ? 'disabled' : ''}>
        <span class="ltr">${LETTERS[i] || i + 1}</span><span class="tx">${esc(o.text)}</span>${stIc}</button>${fb}</div>`;
    }).join('');
    const last = this.index + 1 >= n;
    this.host.innerHTML = `
      <div class="eng-top"><span class="cnt">سؤال ${this.index + 1} من ${n}</span><div class="segs" aria-hidden="true">${segs}</div>
        <span class="pill">${icon('target')}المتطلب: ${esc(q.prerequisiteLabel)}</span></div>
      <div class="q-prompt" id="q-${this.key}">${esc(q.prompt)}</div>
      <div role="group" aria-labelledby="q-${this.key}" aria-live="polite">${opts}</div>
      ${answered ? `<button type="button" class="btn block eng-next" id="eng-next-${this.key}" data-act="next" data-eng="${this.key}">${last ? 'عرض النتيجة' : 'التالي'} ${icon('chevL')}</button>` : ''}`;
    if (answered) $(`#eng-next-${this.key}`)?.focus({ preventScroll: true });
  }
  answer(i) {
    if (this.picked !== null) return;
    const q = this.questions[this.index];
    this.picked = i;
    if (!q.options[i].is_correct) this.weak.push(q.prerequisiteLabel);
    this.render();
  }
  next() {
    this.index++; this.picked = null;
    if (this.index < this.questions.length) { this.render(); return; }
    this.onDone([...new Set(this.weak)]);
  }
}

// One warm result screen for EVERY outcome. The server still classifies the attempt
// (direct / capsule / alert) and notifies the supervisor quietly; the student is only
// ever told they finished, what is now open, and — gently — which ideas to glance at.
function branchHtml(result, cta, kind = 'subject') {
  const copy = kind === 'chapter'
    ? { title: 'أحسنت! اكتمل تشخيص الفصل', desc: 'أنهيت تشخيص هذا الفصل بنجاح، ويمكنك الآن الانتقال إلى المحتوى والبدء في التعلّم.' }
    : { title: 'اكتمل التشخيص بنجاح', desc: 'أنهيت مرحلة التهيئة بنجاح، وجميع فصول المادة أصبحت جاهزة ومتاحة لك الآن للبدء والتعلّم.' };
  const labels = (result && result.weakLabels) || [];
  const tip = labels.length
    ? `<div class="glance"><div class="glance-t">لتنطلق بثقة أكبر</div><div class="glance-d">ألقِ نظرة سريعة على هذه المفاهيم أثناء دراستك:</div><div class="sub-list" style="justify-content:center">${labels.map(l => `<span class="chip">${esc(l)}</span>`).join('')}</div></div>`
    : '';
  return `<div class="branch"><div class="b-ic" style="--c:var(--g)">${icon('award')}</div><h3>${copy.title}</h3><p class="b-d">${copy.desc}</p>${tip}
    <button type="button" class="btn block" style="margin-top:8px" data-act="${cta.act}">${cta.label} ${icon('chevL')}</button></div>`;
}

const App = {
  overview: null,
  tab: 'overview',
  engines: {},
  subj: { phase: 'intro', result: null },
  chap: null,          // { id, meta, step, max, questions, phase, result, summary, summaryErr }
  toastTimer: null,

  /* ── derived state ── */
  get locked() { return !this.overview?.seenIntro; },
  stats() {
    const ch = this.overview?.chapters || [];
    const mastered = ch.filter(c => c.status === 'mastered').length;
    const review = ch.filter(c => c.status === 'needs_review').length;
    return { total: ch.length, mastered, review, pct: ch.length ? Math.round(mastered / ch.length * 100) : 0 };
  },
  chapterById(id) { return this.overview.chapters.find(c => c.chapterId === id); },

  /* ── boot ── */
  async init() {
    this.loadUserChip();
    this.bind();
    await this.loadOverview(true);
  },
  loadUserChip() {
    try {
      for (const src of [sessionStorage.getItem('lg_session_student'), localStorage.getItem('lg_xsession_student'), localStorage.getItem('lg_remember_student')]) {
        if (!src) continue;
        const d = JSON.parse(src);
        const name = d.name || d.admin_name;
        if (name) { $('#user-name-label').textContent = name; $('#user-chip').style.display = 'inline-flex'; break; }
      }
    } catch (e) {}
  },
  async loadOverview(first = false) {
    try {
      this.overview = await apiFetch(`/api/prereq/overview?subject=${SUBJECT_ID}`);
    } catch (e) {
      if (first) {
        $('#boot').hidden = true;
        const box = $('#boot-error'); box.hidden = false;
        box.innerHTML = `<div class="state" style="padding:24px">${icon('alert')}<p>تعذّر تحميل بيانات المقرر: ${esc(e.message)}</p><button type="button" class="btn sm" data-act="retry">إعادة المحاولة</button></div>`;
      } else this.toast('تعذّر تحديث بيانات المقرر: ' + e.message);
      return false;
    }
    $('#boot').hidden = true; $('#boot-error').hidden = true;
    this.subj.phase = this.overview.seenIntro && this.subj.phase === 'intro' ? 'done' : this.subj.phase;
    this.renderChrome();
    if (first) {
      const h = (location.hash || '').replace('#', '');
      this.switchTab(TABS.includes(h) ? h : 'overview', { silent: true });
    } else this.renderActive();
    return true;
  },

  /* ── events ── */
  bind() {
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act]');
      if (!el) return;
      const d = el.dataset;
      const fn = this.acts[d.act];
      if (fn) fn.call(this, d, el);
    });
    $('#tabs').addEventListener('keydown', (e) => {
      const keys = { ArrowLeft: 1, ArrowRight: -1, Home: 'first', End: 'last' };
      if (!(e.key in keys)) return;
      const tabs = [...document.querySelectorAll('#tabs .tab')];
      let i = tabs.indexOf(document.activeElement);
      if (i < 0) return;
      i = keys[e.key] === 'first' ? 0 : keys[e.key] === 'last' ? tabs.length - 1 : (i + keys[e.key] + tabs.length) % tabs.length;
      tabs[i].focus(); e.preventDefault();
    });
    window.addEventListener('resize', () => this.drawRail());
    if (window.ResizeObserver) this.ro = new ResizeObserver(() => this.drawRail());
    this.syncThemeBtn();
  },
  acts: {
    tab(d) { this.switchTab(d.tab); },
    theme() { this.toggleTheme(); },
    'toast-x'() { this.hideToast(); },
    retry() { $('#boot-error').hidden = true; $('#boot').hidden = false; this.loadOverview(true); },
    go(d) { this.switchTab(d.tab); },
    'open-chapter'(d) { this.openChapter(d.id); },
    'start-subject'() { this.startSubject(); },
    answer(d) { this.engines[d.eng]?.answer(Number(d.i)); },
    next(d) { this.engines[d.eng]?.next(); },
    'subj-continue'() { this.switchTab('chapters'); $('#pane-chapters .ch')?.focus({ preventScroll: true }); },
    'chap-back'() { this.chap = null; this.renderChapters(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
    'chap-step'(d) { this.gotoStep(Number(d.step)); },
    'chap-next'() { this.advance(); },
    'chap-prev'() { this.gotoStep(this.chap.step - 1); },
    'chap-retake'() { this.chap.phase = 'ready'; this.chap.result = null; this.renderStep(); },
    'chap-start-diag'() { this.startChapterDiag(); },
    'chap-diag-continue'() { this.chap.max = Math.max(this.chap.max, 3); this.gotoStep(3); },
    'chap-finish'() { this.chap = null; this.switchTab('chapters'); this.refresh(); },
    reveal(d, el) {
      const m = document.getElementById('model-' + d.i);
      m.hidden = !m.hidden;
      el.setAttribute('aria-expanded', String(!m.hidden));
      el.querySelector('span').textContent = m.hidden ? 'عرض الإجابة النموذجية' : 'إخفاء الإجابة النموذجية';
    },
  },

  /* ── theme ── */
  toggleTheme() {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('theme', next); } catch (e) {}
    document.documentElement.setAttribute('data-theme', next);
    this.syncThemeBtn();
  },
  syncThemeBtn() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    $('#theme-btn').setAttribute('aria-label', dark ? 'التبديل إلى الوضع الفاتح' : 'التبديل إلى الوضع الداكن');
  },

  /* ── toast / loading ── */
  toast(msg, kind = '') {
    const t = $('#toast');
    t.className = 'toast show ' + kind;
    $('#toast-msg').textContent = msg;
    t.querySelector('svg use').setAttribute('href', kind === 'ok' ? '#i-unlock' : '#i-info');
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => this.hideToast(), 6500);
  },
  hideToast() { $('#toast').classList.remove('show'); },
  loadingHtml(msg) { return `<div class="state"><div class="spinner"></div>${esc(msg || 'جارٍ التحميل…')}</div>`; },

  /* ── chrome: progress, lock, diag badge ── */
  renderChrome() {
    const s = this.stats();
    $('#tb-pct').textContent = s.pct + '%';
    $('#tb-bar').style.width = s.pct + '%';
    $('#tb-bar-wrap').setAttribute('aria-valuenow', String(s.pct));
    $('#tb-sub').textContent = `أتقنت ${s.mastered} من ${s.total} فصول`;
    const tab = $('#tab-chapters');
    const wasLocked = tab.getAttribute('aria-disabled') === 'true';
    tab.setAttribute('aria-disabled', String(this.locked));
    $('#lock-ic use').setAttribute('href', this.locked ? '#i-lock' : '#i-unlock');
    $('#lock-ic').style.display = '';
    $('#lock-sr').textContent = this.locked ? 'مقفل' : 'مفتوح';
    if (wasLocked && !this.locked) { tab.classList.add('just-unlocked'); setTimeout(() => tab.classList.remove('just-unlocked'), 900); }
    const b = $('#diag-badge');
    b.className = 'tab-badge' + (this.locked ? '' : ' done');
    b.innerHTML = this.locked ? 'بوابة' : `${icon('check')}مكتمل`;
  },

  switchTab(name, { silent } = {}) {
    if (!TABS.includes(name)) name = 'overview';
    this.tab = name;
    TABS.forEach(t => {
      const sel = t === name;
      const btn = $('#tab-' + t);
      btn.setAttribute('aria-selected', String(sel));
      btn.tabIndex = sel ? 0 : -1;
      $('#pane-' + t).hidden = !sel;
    });
    try { history.replaceState(null, '', '#' + name); } catch (e) {}
    this.renderActive();
    if (!silent) window.scrollTo({ top: 0, behavior: 'smooth' });
    $('#tab-' + name).scrollIntoView({ inline: 'center', block: 'nearest' });
  },
  renderActive() {
    ({ overview: () => this.renderOverview(), map: () => this.renderMap(), diag: () => this.renderDiag(),
       chapters: () => this.renderChapters(), progress: () => this.renderProgress() })[this.tab]();
  },
  async refresh() { await this.loadOverview(); },

  /* ── 1. overview ── */
  renderOverview() {
    const s = this.stats();
    const review = this.overview.chapters.find(c => c.status === 'needs_review');
    let next;
    if (this.locked) {
      next = { ok: false, ico: 'target', t: 'الخطوة التالية: تشخيص متطلباتك القبلية', d: 'ثلاثة أسئلة قصيرة بتغذية راجعة فورية — تُحدد نقطة انطلاقك وتفتح لك الفصول الدراسية.', btn: 'ابدأ التشخيص', act: 'go', tab: 'diag' };
    } else if (review) {
      next = { ok: false, ico: 'alert', t: `فصل «${review.title}» يحتاج مراجعة`, d: 'راجع متطلباته القبلية قبل المتابعة لتبني على أساس متين.', btn: 'فتح الفصل', act: 'open-chapter', id: review.chapterId };
    } else {
      next = { ok: true, ico: 'spark', t: 'أنت جاهز للانطلاق', d: s.mastered ? `أتقنت ${s.mastered} من ${s.total} فصول حتى الآن — تابع مسارك.` : 'اختر فصلاً من الفصول الدراسية وابدأ رحلتك.', btn: 'الفصول الدراسية', act: 'go', tab: 'chapters' };
    }
    $('#pane-overview').innerHTML = `
      <div class="hero">
        <svg class="hero-mol" width="280" height="180" viewBox="0 0 300 190" fill="none" aria-hidden="true">
          <g stroke="rgba(255,255,255,.3)" stroke-width="2"><path d="M60 96 120 58M120 58 190 84M190 84 244 46M190 84 226 146M120 58 132 20M60 96 84 150"/></g>
          <g fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.6)" stroke-width="2"><circle cx="60" cy="96" r="20"/><circle cx="120" cy="58" r="26"/><circle cx="190" cy="84" r="22"/><circle cx="244" cy="46" r="13"/><circle cx="226" cy="146" r="16"/><circle cx="132" cy="20" r="10"/><circle cx="84" cy="150" r="12"/></g>
          <circle cx="120" cy="58" r="8" fill="rgba(255,255,255,.65)"/></svg>
        <div class="hero-top"><div class="hero-icon">${icon('flask')}</div><h2>الكيمياء 1 — الفصل الدراسي الأول</h2></div>
        <p>مرحباً بك في مادة الكيمياء 1. ابدأ بالتهيئة والمتطلبات القبلية لتحصل على أفضل نقطة انطلاق قبل الدخول في فصول المقرر.</p>
      </div>
      <div class="next-step ${next.ok ? 'ok' : ''}"><div class="ns-ic">${icon(next.ico)}</div>
        <div class="ns-txt"><div class="ns-t">${esc(next.t)}</div><div class="ns-d">${esc(next.d)}</div></div>
        <button type="button" class="btn sm" data-act="${next.act}" ${next.tab ? `data-tab="${next.tab}"` : ''} ${next.id ? `data-id="${esc(next.id)}"` : ''}>${esc(next.btn)} ${icon('chevL')}</button></div>
      <div class="feat-grid">
        <button type="button" class="feat" style="--c:var(--p)" data-act="go" data-tab="map">
          <span class="f-badge pill ok">متاح</span><div class="f-tile">${icon('map')}</div>
          <div class="f-t">تمهيد وتهيئة المقرر</div><div class="f-d">خارطة فصول المقرر وعلاقاتها، وتشخيص متطلباتك القبلية قبل البدء.</div>
          <div class="f-go">ابدأ الآن ${icon('chevL')}</div></button>
        <button type="button" class="feat" style="--c:var(--v)" data-act="go" data-tab="chapters">
          <span class="f-badge pill ${this.locked ? 'warn' : 'ok'}">${this.locked ? icon('lock') + 'مقفل' : 'متاح'}</span><div class="f-tile">${icon('book')}</div>
          <div class="f-t">الفصول الدراسية</div><div class="f-d">مسار كل فصل خطوة بخطوة: تمهيد، متطلبات، تشخيص، ملخص وأسئلة تقويمية.</div>

          <div class="f-go">${icon('lock')}قريباً</div></div>
      </div>`;
  },

  /* ── 2. concept map ── */
  renderMap() {
    const ch = this.overview.chapters;
    const layerPills = Object.entries(LAYER_LABELS).map(([k, l]) => `<span class="pill l-${k}">${l}</span>`).join('');
    const cards = ch.map((c, i) => this.chapterCard(c, i, ch, true)).join('');
    const prq = (this.overview.subject.subjectPrereqs || []).map(p => {
      const key = Object.keys(SOURCE_ICON).find(k => p.source.includes(k));
      const col = key === 'رياضيات' ? 'var(--v)' : 'var(--p)';
      return `<div class="prq"><div class="p-n">${esc(p.label)}</div><div class="p-r"><span class="pill" style="--c:${col}">${icon(SOURCE_ICON[key] || 'book')}${esc(p.source)}</span><span class="p-u">يخدم <b>${esc(p.usedIn)}</b></span></div></div>`;
    }).join('');
    $('#pane-map').innerHTML = `
      <div class="card"><div class="card-h"><span class="dot"></span><h3>مسار الرحلة التعليمية — فصول المقرر وعلاقاتها</h3><div class="end legend">${layerPills}</div></div>

      ${prq ? `<div class="card"><div class="card-h"><span class="dot"></span><h3>المتطلبات القبلية على مستوى المادة</h3></div><div class="prereq-grid">${prq}</div></div>` : ''}
      <button type="button" class="btn block" style="min-height:64px;font-size:17px" data-act="go" data-tab="${this.locked ? 'diag' : 'chapters'}">${icon('target')}${this.locked ? 'ابدأ رحلة التشخيص واستكشف مستواك الآن' : 'تابع إلى الفصول الدراسية'}${icon('chevL')}</button>`;
    if (this.ro) { this.ro.disconnect(); this.ro.observe($('#rm')); }
    requestAnimationFrame(() => this.drawRail());
  },
  chapterCard(c, i, all, mapMode, startHere = false) {
    const st = STATUS[c.status] || STATUS.default;
    const multi = c.dependsOn.length > 1;
    const idx = (id) => all.findIndex(x => x.chapterId === id);
    const deps = c.dependsOn.length
      ? `${icon('link')} يعتمد على ${c.dependsOn.map(d => { const j = idx(d); return j < 0 ? '' : `<span class="dep-chip" style="--c:var(--l-${all[j].layer})">الفصل ${all[j].orderNum}</span>`; }).join('')}`
      : `${icon('spark')} بداية المقرر`;
    const feeds = all.filter(x => x.dependsOn.length > 1 && x.dependsOn.includes(c.chapterId));
    const tag = feeds.length
      ? `<span class="feeds">${icon('flag')}يُبنى عليه الفصل ${feeds.map(f => f.orderNum).join(' و ')}</span>`
      : `<span>${c.subtopics.length} مواضيع</span>`;
    return `<button type="button" class="ch ${c.status} ${multi ? 'multi' : ''}" data-act="open-chapter" data-id="${esc(c.chapterId)}" data-i="${i}">
      <div class="ch-top"><span class="ch-num">الفصل ${c.orderNum}</span><span class="pill l-${c.layer}">${LAYER_LABELS[c.layer] || esc(c.layer)}</span>${startHere ? '<span class="pill ok">ابدأ من هنا</span>' : ''}${!c.hasDiagnostic ? '<span class="pill mute">تشخيص قريباً</span>' : ''}
        <span class="ch-status">${icon(st.ico)}${st.label}</span></div>
      <div class="ch-title">${esc(c.title)}</div>
      <div class="ch-bot">${deps}<span class="grow">${tag}</span></div></button>`;
  },
  // Dependency rail measured from the real card positions, so it stays correct
  // when card heights change (mobile wrapping, long titles, font swap).
  drawRail() {
    const rm = $('#rm'); const svg = $('#rm-svg');
    if (!rm || !svg || !rm.offsetParent) return;
    const ch = this.overview.chapters;
    const cards = [...rm.querySelectorAll('.ch')];
    if (cards.length !== ch.length) return;
    const RW = parseFloat(getComputedStyle(rm).paddingInlineStart) || 120;
    const X = RW - 30;
    const ys = cards.map(c => c.offsetTop + c.offsetHeight / 2);
    const H = rm.offsetHeight;
    const wide = RW >= 100;
    const parts = [
      `<defs><filter id="glow" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
       <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="arw" d="M1 1l8 4-8 4z"/></marker></defs>`,
    ];
    ch.forEach((c, i) => {
      if (i > 0) {
        const multi = c.dependsOn.length > 1;
        const cls = multi ? 'hi' : (ch[i - 1].status === 'mastered' ? 'done' : 'dim');
        parts.push(`<path class="rl ${cls}" d="M${X} ${ys[i - 1]}V${ys[i]}" ${multi ? 'filter="url(#glow)"' : ''}/>`);
      }
      // skip-level dependencies (e.g. chapter 4 ← 2) become arcs beside the rail
      c.dependsOn.forEach((d) => {
        const j = ch.findIndex(x => x.chapterId === d);
        if (j < 0 || j === i - 1) return;
        const bulge = Math.max(X - 26 - (i - j - 1) * 14, 10);
        parts.push(`<path class="arc" d="M${X - 13} ${ys[j]}C ${bulge} ${ys[j]}, ${bulge} ${ys[i]}, ${X - 15} ${ys[i]}" marker-end="url(#arw)" filter="url(#glow)"/>`);
        if (wide) {
          const mid = (ys[j] + ys[i]) / 2;
          const nums = c.dependsOn.map(x => ch.find(y => y.chapterId === x)?.orderNum).filter(Boolean);
          parts.push(`<text class="arc-txt" x="16" y="${mid}" transform="rotate(-90 16 ${mid})" text-anchor="middle">الفصل ${c.orderNum} يعتمد على ${nums.join(' و ')}</text>`);
        }
      });
    });
    ch.forEach((c, i) => {
      const multi = c.dependsOn.length > 1;
      const y = ys[i];
      if (c.status === 'mastered') parts.push(`<circle class="nd mastered" cx="${X}" cy="${y}" r="13"/><path class="nd-check" d="M${X - 5.5} ${y + .5}l3.6 3.6 7-7.4"/>`);
      else if (c.status === 'needs_review') parts.push(`<circle class="nd-halo" cx="${X}" cy="${y}" r="21"/><circle class="nd needs_review" cx="${X}" cy="${y}" r="13"/><circle class="nd-core" cx="${X}" cy="${y}" r="4.5"/>`);
      else parts.push(`${multi ? `<circle class="nd-halo multi" cx="${X}" cy="${y}" r="22"/>` : ''}<circle class="nd default ${multi ? 'multi' : ''}" style="--c:var(--l-${c.layer})" cx="${X}" cy="${y}" r="12"/>${multi ? `<circle class="nd-core multi" cx="${X}" cy="${y}" r="4.5"/>` : ''}`);
    });
    svg.setAttribute('width', RW); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${RW} ${H}`);
    svg.innerHTML = parts.join('');
  },

  /* ── 3. subject diagnostic (the mandatory gate) ── */
  renderDiag() {
    const pane = $('#pane-diag');
    const ph = this.subj.phase;
    if (ph === 'engine') { /* engine owns the DOM; keep it */ if (!$('#subj-host')) this.subj.phase = 'intro'; else return; }
    if (this.subj.phase === 'result') {
      pane.innerHTML = `<div class="card">${branchHtml(this.subj.result, { act: 'subj-continue', label: 'الانتقال إلى الفصول الدراسية' }, 'subject')}</div>`;
      return;
    }
    if (this.subj.phase === 'loading') { pane.innerHTML = this.loadingHtml(); return; }
    if (!this.locked) {
      pane.innerHTML = `<div class="card"><div class="gate-intro"><div class="gi-ic" style="color:rgb(var(--g));background:rgb(var(--g) / .14);border-color:rgb(var(--g) / .36)">${icon('okc')}</div>
        <div class="gi-t"><h3>أنجزت تشخيص المتطلبات القبلية</h3><p>تم فتح الفصول الدراسية لك. يمكنك مراجعة خارطة المفاهيم أو الانتقال مباشرة إلى فصولك.</p></div>
        <button type="button" class="btn" data-act="go" data-tab="chapters">الفصول الدراسية ${icon('chevL')}</button></div></div>`;
      return;
    }
    pane.innerHTML = `<div class="card"><div class="gate-intro"><div class="gi-ic">${icon('target')}</div>
      <div class="gi-t"><h3>بوابة المقرر: تشخيص متطلباتك القبلية</h3>
        <p>هذه الخطوة إلزامية قبل فتح الفصول الدراسية. ثلاثة أسئلة قصيرة، وتحصل بعد كل خيار على تغذية راجعة فورية تشرح لك الصحيح وسبب اللبس.</p>
        <div class="steps-mini"><span class="pill">${icon('check')}3 أسئلة</span><span class="pill">${icon('bulb')}تغذية راجعة فورية</span><span class="pill warn">${icon('lock')}تفتح الفصول بعد إنهائه</span></div></div>
      <button type="button" class="btn" data-act="start-subject">${icon('target')}ابدأ التشخيص</button></div></div>`;
  },
  async startSubject() {
    const pane = $('#pane-diag');
    pane.innerHTML = this.loadingHtml('جارٍ تحضير الأسئلة…');
    try {
      const data = await apiFetch(`/api/prereq/diagnostic?subject=${SUBJECT_ID}&scope=subject`);
      if (!data.questions?.length) { this.toast('هذا القسم لا يتطلب تشخيصاً قبلياً مسبقاً، يمكنك البدء في دراسة المحتوى مباشرة.'); this.renderDiag(); return; }
      pane.innerHTML = `<div class="card"><button type="button" class="back" data-act="go" data-tab="map">${icon('chevR')}رجوع لخارطة الفصول</button><div id="subj-host"></div></div>`;
      this.subj.phase = 'engine';
      this.engines.subj = new Engine('subj', $('#subj-host'), data.questions, (weak) => this.submitSubject(weak));
      this.engines.subj.render();
    } catch (e) {
      this.subj.phase = 'intro'; this.renderDiag(); this.toast('تعذّر تحميل التشخيص: ' + e.message);
    }
  },
  async submitSubject(weakLabels) {
    $('#pane-diag').innerHTML = this.loadingHtml('جارٍ حساب النتيجة…');
    this.subj.phase = 'loading';
    try {
      const result = await apiFetch('/api/prereq/diagnostic/submit', { method: 'POST', body: JSON.stringify({ subjectId: SUBJECT_ID, scope: 'subject', weakLabels }) });
      this.subj.result = result; this.subj.phase = 'result';
      await this.loadOverview();           // seenIntro is now true → the lock releases live
      this.tab === 'diag' && this.renderDiag();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      this.subj.phase = 'intro'; this.renderDiag(); this.toast('تعذّر إرسال النتيجة: ' + e.message);
    }
  },

  /* ── 4. chapters (locked until the general diagnostic is done) ── */
  renderChapters() {
    const pane = $('#pane-chapters');
    if (this.locked) {
      pane.innerHTML = `<div class="card locked"><div class="lk">${icon('lock')}</div><h3>الفصول الدراسية مقفلة</h3>
        <p>تُفتح الفصول تلقائياً بعد إنهاء تشخيص المتطلبات القبلية العام. يستغرق ثلاثة أسئلة فقط، وتحصل على تغذية راجعة لكل خيار.</p>
        <button type="button" class="btn" data-act="go" data-tab="diag">${icon('target')}انتقل إلى التشخيص</button></div>`;
      return;
    }
    if (this.chap) { this.renderChapterFlow(); return; }
    const ch = this.overview.chapters;
    pane.innerHTML = `<div class="card"><div class="card-h"><span class="dot"></span><h3>الفصول الدراسية</h3><div class="end"><span class="pill ok">${icon('unlock')}مفتوحة</span></div></div>
      <div class="ch-grid">${ch.map((c, i) => this.chapterCard(c, i, ch, false, i === ch.findIndex(x => x.status !== 'mastered'))).join('')}</div></div>`;
  },
  openChapter(id) {
    const c = this.chapterById(id);
    if (!c) return;
    if (this.locked) { this.toast(LOCK_MSG); if (this.tab !== 'diag') this.switchTab('diag'); return; }
    const done = c.status !== 'default';
    this.chap = { id, meta: c, step: 0, max: done ? 3 : 0, questions: null, phase: !c.hasDiagnostic ? 'none' : done ? 'done' : 'ready', result: null, summary: null };
    this.switchTab('chapters');
  },
  renderChapterFlow() {
    const ch = this.chap;
    const items = STEPS.map((s, i) => {
      const state = i === ch.step ? 'cur' : (i < ch.step || i < ch.max ? 'done' : '');
      const reach = i <= ch.max;
      return `<li class="${state}"><button type="button" class="st-btn" data-act="chap-step" data-step="${i}" ${reach ? '' : 'disabled'} ${i === ch.step ? 'aria-current="step"' : ''}>
        <span class="st-dot">${state === 'done' ? icon('check') : icon(s.ico)}</span><span class="st-lb">${s.label}</span></button></li>`;
    }).join('');
    const st = STATUS[ch.meta.status] || STATUS.default;
    $('#pane-chapters').innerHTML = `
      <button type="button" class="back" data-act="chap-back">${icon('chevR')}رجوع للفصول الدراسية</button>
      <div class="card">
        <div class="card-h"><span class="dot"></span><h3>الفصل ${ch.meta.orderNum}: ${esc(ch.meta.title)}</h3>
          <div class="end"><span class="pill l-${ch.meta.layer}">${LAYER_LABELS[ch.meta.layer] || ''}</span><span class="pill ${ch.meta.status === 'mastered' ? 'ok' : ch.meta.status === 'needs_review' ? 'warn' : 'mute'}">${icon(st.ico)}${st.label}</span></div></div>
        <ol class="stepper" aria-label="خطوات الفصل">${items}</ol>
        <div class="step-panel" id="step-panel"></div>
      </div>`;
    this.renderStep();
  },
  gotoStep(i) {
    const ch = this.chap;
    if (i < 0 || i > ch.max || i >= STEPS.length) return;
    ch.step = i;
    if (i === 4 || i === 5) this.ensureSummary();
    this.renderChapterFlow();
    const sp = $('#step-panel'); if (sp) { sp.tabIndex = -1; sp.focus({ preventScroll: true }); }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  },
  advance() {
    const ch = this.chap;
    const n = Math.min(ch.step + 1, STEPS.length - 1);
    ch.max = Math.max(ch.max, n);
    this.gotoStep(n);
  },
  async ensureSummary() {
    const ch = this.chap;
    if (ch.summary || ch.summaryLoading || ch.summaryMissing) return;   // "not authored yet" is remembered: no refetch per step
    ch.summaryLoading = true;
    try {
      const data = await apiFetch(`/api/prereq/chapter-summary?chapterId=${encodeURIComponent(ch.id)}`);
      if (data.summary) { ch.summary = data; ch.summaryErr = null; }
      else { ch.summaryMissing = true; ch.summaryErr = 'لا يوجد ملخص لهذا الفصل'; }
    } catch (e) {
      ch.summaryErr = e.message;
      if (/لا يوجد ملخص/.test(e.message)) ch.summaryMissing = true;   // older servers answer 404
    }
    ch.summaryLoading = false;
    if (this.chap === ch && (ch.step === 4 || ch.step === 5)) this.renderStep();
  },
  async ensureQuestions() {
    const ch = this.chap;
    if (ch.questions) return ch.questions;
    const data = await apiFetch(`/api/prereq/diagnostic?subject=${SUBJECT_ID}&scope=chapter&chapterId=${encodeURIComponent(ch.id)}`);
    ch.questions = data.questions || [];
    return ch.questions;
  },
  navBtns({ prev = true, next = true, nextLabel = 'التالي', nextDisabled = false } = {}) {
    return `<div class="step-nav">${prev ? `<button type="button" class="btn ghost sm" data-act="chap-prev">${icon('chevR')}السابق</button>` : '<span></span>'}
      ${next ? `<button type="button" class="btn sm" data-act="chap-next" ${nextDisabled ? 'disabled' : ''}>${nextLabel} ${icon('chevL')}</button>` : ''}</div>`;
  },
  async renderStep() {
    const ch = this.chap; const host = $('#step-panel');
    if (!ch || !host) return;
    const c = ch.meta;
    const all = this.overview.chapters;
    const S = STEPS[ch.step].key;
    if (S === 'intro') {
      const deps = c.dependsOn.length
        ? c.dependsOn.map(d => { const x = all.find(y => y.chapterId === d); return x ? `<span class="dep-chip" style="--c:var(--l-${x.layer})">الفصل ${x.orderNum}: ${esc(x.title)}</span>` : ''; }).join(' ')
        : '<span class="pill">بداية المقرر</span>';
      host.innerHTML = `<p style="margin:0 0 18px;font-size:16px;line-height:2">${esc(c.description)}</p>
        <h4 style="font-size:15px;margin-bottom:8px">مواضيع الفصل</h4><div class="sub-list">${c.subtopics.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>
        <h4 style="font-size:15px;margin:18px 0 8px">يعتمد على</h4><div class="ch-bot" style="gap:10px">${icon('link')}${deps}</div>
        ${this.navBtns({ prev: false, nextLabel: 'متابعة إلى المتطلبات القبلية' })}`;
    } else if (S === 'prereq') {
      if (!c.hasDiagnostic) {
        host.innerHTML = `<div class="branch"><div class="b-ic" style="--c:var(--p)">${icon('check')}</div><h3>لا متطلبات قبلية لهذا الفصل</h3><p class="b-d">يمكنك المتابعة مباشرة، ولن تحتاج إلى أي تهيئة إضافية قبل البدء.</p></div>${this.navBtns({ nextLabel: 'متابعة إلى تشخيص الفصل' })}`;
        return;
      }
      host.innerHTML = this.loadingHtml();
      try {
        const qs = await this.ensureQuestions();
        if (this.chap !== ch || STEPS[ch.step].key !== 'prereq') return;
        host.innerHTML = `<p style="margin:0 0 16px;font-size:16px;line-height:1.95">قبل دخول هذا الفصل سنراجع معك <b>${qs.length}</b> متطلبات قبلية أساسية، يرتكز عليها فهمك للمحتوى:</p>
          <div class="mini-grid">${qs.map((q, i) => `<div class="mini"><span class="mn">${i + 1}</span><span class="mt">${esc(q.prerequisiteLabel)}</span></div>`).join('')}</div>
          ${this.navBtns({ nextLabel: 'متابعة إلى تشخيص الفصل' })}`;
      } catch (e) { host.innerHTML = `<div class="state">${icon('alert')}<p>تعذّر تحميل المتطلبات: ${esc(e.message)}</p></div>${this.navBtns({ next: false })}`; }
    } else if (S === 'diag') {
      if (!c.hasDiagnostic) {
        host.innerHTML = `<div class="branch"><div class="b-ic" style="--c:var(--p)">${icon('check')}</div><h3>لا يحتاج هذا الفصل إلى تشخيص</h3><p class="b-d">ننتقل معاً إلى محتوى الفصل مباشرة.</p></div>${this.navBtns({ nextLabel: 'متابعة إلى المحتوى' })}`;
        return;
      }
      if (ch.phase === 'ready') {
        host.innerHTML = `<div class="gate-intro"><div class="gi-ic">${icon('target')}</div><div class="gi-t"><h3>تشخيص الفصل</h3>
          <p>أسئلة قصيرة تقيس جاهزيتك لهذا الفصل، مع تغذية راجعة فورية لكل خيار. لا يمنعك أي شيء من المتابعة بعدها.</p></div>
          <button type="button" class="btn" data-act="chap-start-diag">${icon('target')}ابدأ التشخيص</button></div>${this.navBtns({ next: false })}`;
      } else if (ch.phase === 'loading') {
        host.innerHTML = this.loadingHtml();
      } else if (ch.phase === 'engine') {
        if (!$('#chap-host')) host.innerHTML = '<div id="chap-host"></div>';
        this.engines.chap.host = $('#chap-host'); this.engines.chap.render();
      } else if (ch.phase === 'result') {
        host.innerHTML = branchHtml(ch.result, { act: 'chap-diag-continue', label: 'متابعة إلى المحتوى' }, 'chapter');
      } else {
        const st = STATUS[c.status];
        host.innerHTML = `<div class="branch"><div class="b-ic" style="--c:var(--${c.status === 'mastered' ? 'g' : 'a'})">${icon(st.ico)}</div><h3>أنجزت تشخيص هذا الفصل</h3>
          <p class="b-d">حالتك الحالية في هذا الفصل: <b>${st.label}</b>. يمكنك المتابعة إلى المحتوى أو إعادة التشخيص.</p>
          <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button type="button" class="btn" data-act="chap-diag-continue">متابعة إلى المحتوى ${icon('chevL')}</button>
          <button type="button" class="btn ghost" data-act="chap-retake">إعادة التشخيص</button></div></div>${this.navBtns({ next: false })}`;
      }
    } else if (S === 'content') {
      host.innerHTML = `<div class="soon-box"><div class="sb-ic">${icon('book')}</div><h3 style="font-size:20px;margin-bottom:6px">محتوى الفصل قيد الإعداد</h3>
        <p style="margin:0;color:var(--muted);line-height:1.9">سيُضاف شرح كل موضوع من مواضيع هذا الفصل هنا. تابع الآن إلى ملخص الفصل والأسئلة التقويمية.</p>
        <div class="soon-list">${c.subtopics.map(t => `<div>${icon('book')}${esc(t)}<span class="pill mute">قريباً</span></div>`).join('')}</div></div>
        ${this.navBtns({ nextLabel: 'متابعة إلى ملخص الفصل' })}`;
    } else if (S === 'summary' || S === 'eval') {
      if (ch.summaryErr) {
        if (/لا يوجد ملخص/.test(ch.summaryErr)) {   // chapter content not authored yet — a calm "soon", never a raw server message
          const msg = S === 'summary' ? 'ملخص هذا الفصل قيد الإعداد وسيُضاف قريباً.' : 'الأسئلة التقويمية لهذا الفصل قيد الإعداد وستُضاف قريباً.';
          const nav = S === 'summary' ? this.navBtns({ nextLabel: 'الأسئلة التقويمية' })
            : `<div class="step-nav"><button type="button" class="btn ghost sm" data-act="chap-prev">${icon('chevR')}السابق</button><button type="button" class="btn sm" data-act="chap-finish">${icon('check')}العودة للفصول</button></div>`;
          host.innerHTML = `<div class="soon-box"><div class="sb-ic">${icon('book')}</div><h3 style="font-size:20px;margin-bottom:6px">قريباً</h3><p style="margin:0;color:var(--muted);line-height:1.9">${msg}</p></div>${nav}`;
        } else {
          host.innerHTML = `<div class="state">${icon('alert')}<p>تعذّر تحميل هذا القسم، حاول مرة أخرى بعد قليل.</p></div>${this.navBtns({ next: S === 'summary', nextLabel: 'أسئلة تقويمية' })}`;
        }
        return;
      }
      if (!ch.summary) { host.innerHTML = this.loadingHtml(); this.ensureSummary(); return; }
      if (S === 'summary') {
        const s = ch.summary.summary;
        host.innerHTML = `<div class="sum-grid">
          <div class="sum-block"><h4>المفاهيم الأساسية</h4>${s.keyConcepts.map(k => `<span class="chip" style="margin:3px">${esc(k)}</span>`).join('')}</div>
          <div class="sum-block"><h4>مصطلحات جديدة</h4>${s.newTerms.map(t => `<div class="term"><b>${esc(t.term)}</b> — ${esc(t.definition)}</div>`).join('')}</div>
          <div class="sum-block"><h4>القانون الأساسي</h4><div class="term">${esc(s.coreRule)}</div></div>
          <div class="sum-block"><h4>مثال محلول</h4><div class="term">${esc(s.workedExample)}</div></div>
          <div class="sum-block"><h4>خطأ شائع</h4><div class="term">${esc(s.commonPitfall)}</div></div></div>
          ${this.navBtns({ nextLabel: 'متابعة إلى الأسئلة التقويمية' })}`;
      } else {
        host.innerHTML = `<div class="eval-grid">${ch.summary.evaluationQuestions.map((q, i) => `
          <div class="ev ${esc(q.level)}"><div class="ev-l">${icon(q.level === 'knowledge' ? 'book' : 'bulb')}${q.level === 'knowledge' ? 'معرفي' : 'مهارات تفكير عليا'}</div>
            <div class="ev-p">${esc(q.prompt)}</div>
            <button type="button" class="reveal" data-act="reveal" data-i="${i}" aria-expanded="false" aria-controls="model-${i}">${icon('chevL')}<span>عرض الإجابة النموذجية</span></button>
            <div class="model" id="model-${i}" hidden>${esc(q.modelAnswer)}</div></div>`).join('')}</div>
          <div class="step-nav"><button type="button" class="btn ghost sm" data-act="chap-prev">${icon('chevR')}السابق</button>
          <button type="button" class="btn sm" data-act="chap-finish">${icon('check')}أنهيت الفصل — العودة للفصول</button></div>`;
      }
    }
  },
  async startChapterDiag() {
    const ch = this.chap;
    ch.phase = 'loading'; this.renderStep();
    try {
      const qs = await this.ensureQuestions();
      if (!qs.length) { ch.phase = 'ready'; this.renderStep(); this.toast('هذا القسم لا يتطلب تشخيصاً قبلياً مسبقاً، يمكنك المتابعة مباشرة.'); return; }
      this.engines.chap = new Engine('chap', null, qs, (weak) => this.submitChapter(weak));
      ch.phase = 'engine'; this.renderStep();
    } catch (e) { ch.phase = 'ready'; this.renderStep(); this.toast('تعذّر تحميل التشخيص: ' + e.message); }
  },
  async submitChapter(weakLabels) {
    const ch = this.chap;
    ch.phase = 'loading'; this.renderStep();
    try {
      ch.result = await apiFetch('/api/prereq/diagnostic/submit', { method: 'POST', body: JSON.stringify({ subjectId: SUBJECT_ID, scope: 'chapter', chapterId: ch.id, weakLabels }) });
      ch.phase = 'result';
      ch.max = Math.max(ch.max, 3);
      const before = ch.meta.status;
      await this.loadOverview();                 // progress ring + chapter status update live
      if (this.chap === ch) { ch.meta = this.chapterById(ch.id) || ch.meta; this.renderChapterFlow(); }
      if (before !== ch.meta.status) window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) { ch.phase = 'ready'; this.renderStep(); this.toast('تعذّر إرسال النتيجة: ' + e.message); }
  },

  /* ── 5. my progress ── */
  renderProgress() {
    const s = this.stats(); const ch = this.overview.chapters;
    const rows = ch.map(c => {
      const st = STATUS[c.status] || STATUS.default;
      const pc = c.status === 'mastered' ? 'ok' : c.status === 'needs_review' ? 'warn' : 'mute';
      return `<div class="p-row"><div class="pr-n">الفصل ${c.orderNum}: ${esc(c.title)}<small>${LAYER_LABELS[c.layer] || ''} · ${c.subtopics.length} مواضيع</small></div>
        <span class="pill ${pc}">${icon(st.ico)}${st.label}</span>
        <button type="button" class="btn ghost sm" data-act="open-chapter" data-id="${esc(c.chapterId)}">${this.locked ? icon('lock') : ''}فتح</button></div>`;
    }).join('');
    $('#pane-progress').innerHTML = `
      <div class="card"><div class="prog-top"><div class="ring" style="--v:${s.pct}" role="img" aria-label="${s.pct}% من الفصول متقنة"><div>${s.pct}%</div></div>
        <div class="pt"><h3>تقدّمك التراكمي في الكيمياء 1</h3><p>أتقنت <b>${s.mastered}</b> من <b>${s.total}</b> فصول${s.review ? `، و<b>${s.review}</b> ${s.review === 1 ? 'فصل يحتاج' : 'فصول تحتاج'} مراجعة` : ''}. يرتفع المؤشر كلما أتقنت متطلبات فصل جديد.</p></div></div></div>
      <div class="card"><div class="card-h"><span class="dot"></span><h3>حالة الفصول</h3></div>
        <div class="p-row"><div class="pr-n">تشخيص المتطلبات القبلية العام<small>بوابة فتح الفصول الدراسية</small></div>
          <span class="pill ${this.locked ? 'warn' : 'ok'}">${icon(this.locked ? 'lock' : 'check')}${this.locked ? 'لم يُنجز' : 'مكتمل'}</span>
          ${this.locked ? `<button type="button" class="btn sm" data-act="go" data-tab="diag">ابدأ</button>` : ''}</div>
        ${rows}</div>`;
  },
};

App.init();
</script>
</body>
</html>
